name: Companion Labs CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Python Code Syntax
      run: |
        python -m py_compile labs/lab-03-ai-recon-pipeline/recon_pipeline.py labs/lab-04-ai-vuln-assessment/vuln_scanner.py labs/lab-05-purple-team/purple_eval.py labs/lab-06-ai-alert-classifier/alert_classifier.py run_labs.py

    - name: Execute Full Lab Suite (Simulation Mode)
      run: |
        python run_labs.py --all
