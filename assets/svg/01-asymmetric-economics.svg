    <text x="185" y="311" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Asymmetric Advantage: Unlimited Zero-Cost Attempts</text>
  </g>

  <!-- Right Card: Defender Response -->
  <g transform="translate(475, 95)">
    <rect width="370" height="345" fill="#ffffff" stroke="#0284c7" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 362 0 Q 370 0 370 8 L 370 42 L 0 42 Z" fill="#e0f2fe"/>
    <text x="185" y="27" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="0.5">DEFENDER PARADIGM (MANUAL SOC)</text>

    <!-- Metrics -->
