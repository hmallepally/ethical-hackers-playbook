      <text x="0" y="24" fill="#0284c7" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">$45.00 / alert</text>
      <text x="0" y="42" fill="#475569" font-family="sans-serif" font-size="16">Tier-1 analyst human cognitive overhead</text>
