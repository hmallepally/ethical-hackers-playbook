      <text x="0" y="24" fill="#0284c7" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">~20-30 Alerts / day</text>
      <text x="0" y="42" fill="#475569" font-family="sans-serif" font-size="16">Subject to cognitive fatigue and alert flooding</text>
    </g>

    <!-- Footer tag -->
    <rect x="20" y="292" width="330" height="28" fill="#f0f9ff" stroke="#bae6fd" rx="4"/>
    <text x="185" y="311" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Defensive Imperative: AI-Native Sub-Minute Defense</text>
  </g>

  <!-- Central VS Icon -->
  <circle cx="450" cy="268" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="274" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">VS</text>
