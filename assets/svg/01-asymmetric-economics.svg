<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bg-grad)" rx="12"/>
  <rect width="898" height="478" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="60" y1="60" x2="840" y2="60"/>
    <line x1="60" y1="140" x2="840" y2="140"/>
    <line x1="60" y1="220" x2="840" y2="220"/>
    <line x1="60" y1="300" x2="840" y2="300"/>
    <line x1="60" y1="380" x2="840" y2="380"/>
  </g>

  <!-- Title Header -->
  <text x="450" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">THE ECONOMICS OF ASYMMETRIC CYBER WARFARE</text>
  <text x="450" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Marginal Cost per Action: Attacker Automation vs. Traditional Enterprise Defense</text>

  <!-- Left Card: Adversary Machine Speed -->
  <g transform="translate(60, 95)">
    <rect width="360" height="340" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5" rx="8" opacity="0.95"/>
    <rect width="360" height="42" fill="url(#red-grad)" rx="8" rx-bottom="0"/>
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 42 L 0 42 Z" fill="url(#red-grad)"/>
    <text x="180" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">ATTACKER ENGINE (LOCAL LLM AGENT)</text>

    <!-- Metrics -->
    <g transform="translate(24, 70)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">UNIT OPERATION COST</text>
      <text x="0" y="24" fill="#f87171" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="800">$0.000004 / payload</text>
      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Zero incremental labor on consumer hardware</text>
    </g>

    <g transform="translate(24, 145)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">INTRUSION BREAKOUT VELOCITY</text>
      <text x="0" y="24" fill="#f87171" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="800">27 Seconds</text>
      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Fastest recorded 2026 breakout speed</text>
    </g>

    <g transform="translate(24, 220)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">OPERATIONAL SCALE</text>
      <text x="0" y="24" fill="#f87171" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="800">10,000+ Probes / min</text>
      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Polymorphic generative evasion across all subdomains</text>
    </g>

    <!-- Footer tag -->
    <rect x="24" y="290" width="312" height="26" fill="#3b1d28" rx="4"/>
    <text x="180" y="307" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Asymmetric Advantage: Unlimited Zero-Cost Attempts</text>
  </g>

  <!-- Right Card: Defender Response -->
  <g transform="translate(480, 95)">
    <rect width="360" height="340" fill="#132338" stroke="#0ea5e9" stroke-width="1.5" rx="8" opacity="0.95"/>
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 42 L 0 42 Z" fill="url(#blue-grad)"/>
    <text x="180" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DEFENDER PARADIGM (MANUAL SOC)</text>

    <!-- Metrics -->
    <g transform="translate(24, 70)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">MANUAL TRIAGE COST</text>
      <text x="0" y="24" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="800">$45.00 / alert</text>
      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Tier-1 analyst human cognitive overhead</text>
    </g>

    <g transform="translate(24, 145)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">AVERAGE RESPONSE TIME</text>
      <text x="0" y="24" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="800">29 Minutes</text>
      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Human-bound detection, ticketing, and review</text>
    </g>

    <g transform="translate(24, 220)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TRIAGE CAPACITY</text>
      <text x="0" y="24" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="800">~20-30 Alerts / day</text>
      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Subject to cognitive fatigue and alert flooding</text>
    </g>

    <!-- Footer tag -->
    <rect x="24" y="290" width="312" height="26" fill="#0f3456" rx="4"/>
    <text x="180" y="307" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Defensive Imperative: AI-Native Sub-Minute Defense</text>
  </g>

  <!-- Central VS Icon -->
  <circle cx="450" cy="265" r="22" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="450" y="271" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">VS</text>
</svg>
