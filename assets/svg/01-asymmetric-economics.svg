<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="900" height="624" fill="#ffffff"/>
  <rect width="896" height="619" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="44" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="0.5">THE ECONOMICS OF ASYMMETRIC CYBER WARFARE</text>
  <text x="450" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">Marginal Cost per Action: Attacker Automation vs. Traditional Enterprise Defense</text>

  <!-- Left Card: Adversary Machine Speed -->
  <g transform="translate(55, 95)">
    <rect width="370" height="345" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="8"/>
    <rect width="370" height="42" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 362 0 Q 370 0 370 8 L 370 42 L 0 42 Z" fill="#fee2e2"/>
    <text x="185" y="27" fill="#b91c1c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="0.5">ATTACKER ENGINE (LOCAL LLM AGENT)</text>

    <!-- Metrics -->
    <g transform="translate(24, 68)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">UNIT OPERATION COST</text>
      <text x="0" y="24" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">$0.000004 / payload</text>
      <text x="0" y="42" fill="#475569" font-family="sans-serif" font-size="16">Zero incremental labor on consumer hardware</text>
    </g>

    <g transform="translate(24, 142)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">INTRUSION BREAKOUT VELOCITY</text>
      <text x="0" y="24" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">27 Seconds</text>
      <text x="0" y="42" fill="#475569" font-family="sans-serif" font-size="16">Fastest recorded 2026 breakout speed (CrowdStrike)</text>
    </g>

    <g transform="translate(24, 216)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">OPERATIONAL SCALE</text>
      <text x="0" y="24" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">10,000+ Probes / min</text>
      <text x="0" y="42" fill="#475569" font-family="sans-serif" font-size="16">Polymorphic generative evasion across all subdomains</text>
    </g>

    <!-- Footer tag -->
