<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 374.4" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="540" height="374.4" fill="#ffffff"/>
  <rect width="537.6" height="371.4" x="1.2" y="1.2" fill="none" stroke="#e2e8f0" stroke-width="0.9" rx="4.8"/>

  <!-- Title Header -->
  <text x="270" y="26.4" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="0.5">THE ECONOMICS OF ASYMMETRIC CYBER WARFARE</text>
  <text x="270" y="40.8" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">Marginal Cost per Action: Attacker Automation vs. Traditional Enterprise Defense</text>

  <!-- Left Card: Adversary Machine Speed -->
  <g transform="translate(33, 57)">
    <rect width="222" height="207" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" rx="4.8"/>
    <rect width="222" height="25.2" fill="#fef2f2" stroke="#dc2626" stroke-width="0.9" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 217.2 0 Q 222 0 222 4.8 L 222 25.2 L 0 25.2 Z" fill="#fee2e2"/>
    <text x="111" y="16.2" fill="#b91c1c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="0.5">ATTACKER ENGINE (LOCAL LLM AGENT)</text>

    <!-- Metrics -->
    <g transform="translate(14.4, 40.8)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">UNIT OPERATION COST</text>
      <text x="0" y="14.4" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">$0.000004 / payload</text>
      <text x="0" y="25.2" fill="#475569" font-family="sans-serif" font-size="16">Zero incremental labor on consumer hardware</text>
    </g>

    <g transform="translate(14.4, 85.2)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">INTRUSION BREAKOUT VELOCITY</text>
      <text x="0" y="14.4" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">27 Seconds</text>
      <text x="0" y="25.2" fill="#475569" font-family="sans-serif" font-size="16">Fastest recorded 2026 breakout speed (CrowdStrike)</text>
    </g>

    <g transform="translate(14.4, 129.6)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">OPERATIONAL SCALE</text>
      <text x="0" y="14.4" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">10,000+ Probes / min</text>
      <text x="0" y="25.2" fill="#475569" font-family="sans-serif" font-size="16">Polymorphic generative evasion across all subdomains</text>
    </g>

    <!-- Footer tag -->
    <rect x="12" y="175.2" width="198" height="16.8" fill="#fef2f2" stroke="#fca5a5" rx="2.4"/>
    <text x="111" y="186.6" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Asymmetric Advantage: Unlimited Zero-Cost Attempts</text>
  </g>

  <!-- Right Card: Defender Response -->
  <g transform="translate(285, 57)">
    <rect width="222" height="207" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 217.2 0 Q 222 0 222 4.8 L 222 25.2 L 0 25.2 Z" fill="#e0f2fe"/>
    <text x="111" y="16.2" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="0.5">DEFENDER PARADIGM (MANUAL SOC)</text>

    <!-- Metrics -->
    <g transform="translate(14.4, 40.8)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">MANUAL TRIAGE COST</text>
      <text x="0" y="14.4" fill="#0284c7" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">$45.00 / alert</text>
      <text x="0" y="25.2" fill="#475569" font-family="sans-serif" font-size="16">Tier-1 analyst human cognitive overhead</text>
    </g>

    <g transform="translate(14.4, 85.2)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">AVERAGE RESPONSE TIME</text>
      <text x="0" y="14.4" fill="#0284c7" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">29 Minutes</text>
      <text x="0" y="25.2" fill="#475569" font-family="sans-serif" font-size="16">Human-bound detection, ticketing, and review</text>
    </g>

    <g transform="translate(14.4, 129.6)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="700">TRIAGE CAPACITY</text>
      <text x="0" y="14.4" fill="#0284c7" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800">~20-30 Alerts / day</text>
      <text x="0" y="25.2" fill="#475569" font-family="sans-serif" font-size="16">Subject to cognitive fatigue and alert flooding</text>
    </g>

    <!-- Footer tag -->
    <rect x="12" y="175.2" width="198" height="16.8" fill="#f0f9ff" stroke="#bae6fd" rx="2.4"/>
    <text x="111" y="186.6" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Defensive Imperative: AI-Native Sub-Minute Defense</text>
  </g>

  <!-- Central VS Icon -->
  <circle cx="270" cy="160.8" r="13.2" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="164.4" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">VS</text>
</svg>
