<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
    <rect width="100%" height="100%" fill="#ffffff" />
    <text x="270" y="30" font-family="'Segoe UI', sans-serif" font-size="18px" font-weight="bold" text-anchor="middle" fill="#111827">ECONOMICS OF ASYMMETRIC CYBER WARFARE</text>
    <text x="270" y="50" font-family="'Segoe UI', sans-serif" font-size="14px" text-anchor="middle" fill="#6B7280">Attacker Automation vs. Enterprise Defense</text>
    
    <!-- Left Card -->
    <rect x="20" y="80" width="230" height="250" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" />
    <rect x="20" y="80" width="230" height="40" rx="8" fill="#EF4444" />
    <text x="135" y="105" font-family="'Segoe UI', sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" fill="#ffffff">ATTACKER ENGINE</text>
    
    <text x="35" y="145" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#6B7280">COST</text>
    <text x="35" y="165" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#B91C1C">$0.000004 / payload</text>
    
    <text x="35" y="200" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#6B7280">SPEED</text>
    <text x="35" y="220" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#B91C1C">27 Seconds breakout</text>
    
    <text x="35" y="255" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#6B7280">SCALE</text>
    <text x="35" y="275" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#B91C1C">10,000+ Probes/min</text>
    
    <text x="135" y="315" font-family="'Segoe UI', sans-serif" font-size="12px" font-style="italic" text-anchor="middle" fill="#B91C1C">Unlimited Zero-Cost Attempts</text>

    <!-- Right Card -->
    <rect x="290" y="80" width="230" height="250" rx="8" fill="#F0F9FF" stroke="#3B82F6" stroke-width="2" />
    <rect x="290" y="80" width="230" height="40" rx="8" fill="#3B82F6" />
    <text x="405" y="105" font-family="'Segoe UI', sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" fill="#ffffff">DEFENDER (MANUAL SOC)</text>
    
    <text x="305" y="145" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#6B7280">COST</text>
    <text x="305" y="165" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#1D4ED8">$45.00 / alert</text>
    
    <text x="305" y="200" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#6B7280">SPEED</text>
    <text x="305" y="220" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#1D4ED8">29 Minutes response</text>
    
    <text x="305" y="255" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#6B7280">SCALE</text>
    <text x="305" y="275" font-family="'Segoe UI', sans-serif" font-size="16px" font-weight="bold" fill="#1D4ED8">~20-30 Alerts/day</text>
    
    <text x="405" y="315" font-family="'Segoe UI', sans-serif" font-size="12px" font-style="italic" text-anchor="middle" fill="#1D4ED8">AI-Native Sub-Minute Defense</text>
    
    <!-- VS Circle -->
    <circle cx="270" cy="205" r="20" fill="#ffffff" stroke="#9CA3AF" stroke-width="2" />
    <text x="270" y="210" font-family="'Segoe UI', sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" fill="#374151">VS</text>
</svg>
