<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <rect width="540" height="340" fill="#ffffff"/>
  <rect width="536" height="336" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title -->
  <text x="270" y="30" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" text-anchor="middle">THE CYBERSECURITY OODA LOOP (BOYD DECISION CYCLE)</text>
  <text x="270" y="48" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Machine-Speed Compression: From 4.5 Hours (Manual) to &lt; 60 Seconds (AI-Native)</text>

  <!-- Arrows between boxes -->
  <line x1="137" y1="140" x2="147" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="272" y1="140" x2="282" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="407" y1="140" x2="417" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 1. OBSERVE -->
  <g transform="translate(14, 70)">
    <rect width="123" height="145" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="6"/>
    <rect width="123" height="28" fill="#3b82f6" rx="6"/>
    <rect width="123" height="14" y="14" fill="#3b82f6"/>
    <text x="62" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. OBSERVE</text>
    <text x="62" y="44" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Continuous Sensing</text>
    <text x="10" y="62" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Ingest logs, SIEM, API</text>
    <text x="10" y="78" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Shadow AI discovery</text>
    <text x="10" y="94" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Network traffic taps</text>
    <rect x="10" y="112" width="103" height="22" fill="#dbeafe" rx="4"/>
    <text x="62" y="127" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI: &lt; 1 Second</text>
  </g>

  <!-- 2. ORIENT -->
  <g transform="translate(149, 70)">
    <rect width="123" height="145" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <rect width="123" height="28" fill="#f59e0b" rx="6"/>
    <rect width="123" height="14" y="14" fill="#f59e0b"/>
    <text x="62" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. ORIENT</text>
    <text x="62" y="44" fill="#92400e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Context &amp; Correlation</text>
    <text x="10" y="62" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Graph correlation</text>
    <text x="10" y="78" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• ATT&amp;CK mapping</text>
    <text x="10" y="94" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Blast radius score</text>
    <rect x="10" y="112" width="103" height="22" fill="#fef9c3" rx="4"/>
    <text x="62" y="127" fill="#92400e" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI: &lt; 5 Seconds</text>
  </g>

  <!-- 3. DECIDE -->
  <g transform="translate(284, 70)">
    <rect width="123" height="145" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6"/>
    <rect width="123" height="28" fill="#22c55e" rx="6"/>
    <rect width="123" height="14" y="14" fill="#22c55e"/>
    <text x="62" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. DECIDE</text>
    <text x="62" y="44" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Response Selection</text>
    <text x="10" y="62" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Pre-built containment</text>
    <text x="10" y="78" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Incident approval gate</text>
    <text x="10" y="94" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Rollback verification</text>
    <rect x="10" y="112" width="103" height="22" fill="#dcfce7" rx="4"/>
    <text x="62" y="127" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI: &lt; 2 Seconds</text>
  </g>

  <!-- 4. ACT -->
  <g transform="translate(419, 70)">
    <rect width="107" height="145" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
    <rect width="107" height="28" fill="#ef4444" rx="6"/>
    <rect width="107" height="14" y="14" fill="#ef4444"/>
    <text x="54" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. ACT</text>
    <text x="54" y="44" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Execution</text>
    <text x="10" y="62" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Isolate host</text>
    <text x="10" y="78" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Revoke credentials</text>
    <text x="10" y="94" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">• Block C2 IPs</text>
    <rect x="10" y="112" width="87" height="22" fill="#fef2f2" rx="4"/>
    <text x="54" y="127" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SOAR: &lt; 30s</text>
