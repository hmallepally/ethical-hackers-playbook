<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="900" height="320" fill="#ffffff"/>
  <rect width="896" height="316" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="36" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">THE CYBERSECURITY OODA LOOP (BOYD DECISION CYCLE)</text>
  <text x="450" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Machine-Speed Compression: From 4.5 Hours (Manual) to &lt; 60 Seconds (AI-Native)</text>

  <!-- 4 Step Boxes -->
  <!-- 1. OBSERVE -->
  <g transform="translate(45, 85)">
    <rect width="180" height="150" fill="#ffffff" stroke="#0284c7" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 34 L 0 34 Z" fill="#e0f2fe"/>
    <text x="90" y="22" fill="#0369a1" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">1. OBSERVE</text>
    <text x="16" y="58" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Continuous Sensing</text>
    <text x="16" y="78" fill="#475569" font-family="sans-serif" font-size="9.5">• Ingest logs, EDR &amp; API</text>
    <text x="16" y="96" fill="#475569" font-family="sans-serif" font-size="9.5">• Shadow AI telemetry</text>
    <text x="16" y="114" fill="#475569" font-family="sans-serif" font-size="9.5">• Network netflow traps</text>
    <rect x="12" y="124" width="156" height="18" fill="#f0f9ff" rx="3"/>
    <text x="90" y="137" fill="#0284c7" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">AI: &lt; 1 Second</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="225" y1="160" x2="255" y2="160" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- 2. ORIENT -->
  <g transform="translate(260, 85)">
    <rect width="180" height="150" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 34 L 0 34 Z" fill="#f5f3ff"/>
    <text x="90" y="22" fill="#6d28d9" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">2. ORIENT</text>
    <text x="16" y="58" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Context &amp; Correlation</text>
    <text x="16" y="78" fill="#475569" font-family="sans-serif" font-size="9.5">• Graph correlation</text>
    <text x="16" y="96" fill="#475569" font-family="sans-serif" font-size="9.5">• ATT&amp;CK / ATLAS match</text>
    <text x="16" y="114" fill="#475569" font-family="sans-serif" font-size="9.5">• Asset blast radius score</text>
    <rect x="12" y="124" width="156" height="18" fill="#faf5ff" rx="3"/>
    <text x="90" y="137" fill="#7c3aed" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">AI: &lt; 5 Seconds</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="440" y1="160" x2="470" y2="160" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- 3. DECIDE -->
  <g transform="translate(475, 85)">
    <rect width="180" height="150" fill="#ffffff" stroke="#ea580c" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 34 L 0 34 Z" fill="#ffedd5"/>
    <text x="90" y="22" fill="#c2410c" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. DECIDE</text>
    <text x="16" y="58" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Response Selection</text>
    <text x="16" y="78" fill="#475569" font-family="sans-serif" font-size="9.5">• Pre-draft containment</text>
    <text x="16" y="96" fill="#475569" font-family="sans-serif" font-size="9.5">• Human approval gate</text>
    <text x="16" y="114" fill="#475569" font-family="sans-serif" font-size="9.5">• Rollback verification</text>
    <rect x="12" y="124" width="156" height="18" fill="#fff7ed" rx="3"/>
    <text x="90" y="137" fill="#ea580c" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">AI: &lt; 2 Seconds</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="655" y1="160" x2="685" y2="160" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- 4. ACT -->
  <g transform="translate(690, 85)">
    <rect width="165" height="150" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 157 0 Q 165 0 165 8 L 165 34 L 0 34 Z" fill="#dcfce7"/>
    <text x="82.5" y="22" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">4. ACT</text>
    <text x="14" y="58" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Execution</text>
    <text x="14" y="78" fill="#475569" font-family="sans-serif" font-size="9.5">• Isolate compromised host</text>
    <text x="14" y="96" fill="#475569" font-family="sans-serif" font-size="9.5">• Invalidate session tokens</text>
    <text x="14" y="114" fill="#475569" font-family="sans-serif" font-size="9.5">• Block C2 egress IPs</text>
    <rect x="10" y="124" width="145" height="18" fill="#f0fdf4" rx="3"/>
    <text x="82.5" y="137" fill="#059669" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SOAR: &lt; 30 Seconds</text>
  </g>

  <!-- Feedback Loop Path Bottom -->
  <path d="M 772 235 V 275 H 135 V 235" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-emerald)"/>
  <rect x="360" y="263" width="180" height="24" fill="#ffffff" stroke="#86efac" rx="4"/>
  <text x="450" y="279" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ADAPTIVE FEEDBACK LOOP</text>
</svg>
