  <!-- Feedback Loop -->
  <rect x="60" y="240" width="420" height="28" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4" rx="14"/>
  <text x="270" y="259" fill="#6366f1" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ADAPTIVE FEEDBACK LOOP — Continuous Learning</text>

  <!-- Summary -->
  <text x="270" y="296" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Total AI-Native OODA Cycle: &lt; 47 Seconds</text>
  <text x="270" y="315" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Manual SOC: 4.5 Hours → AI SOC: Under 1 Minute</text>
</svg>
