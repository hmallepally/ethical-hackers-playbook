<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <rect width="540" height="420" fill="#ffffff"/>
  <rect width="536" height="416" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title -->
  <text x="270" y="28" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" text-anchor="middle">THE ADVERSARIAL THREAT MODELING TRINITY</text>
  <text x="270" y="46" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Traditional Kill Chain vs. ATT&amp;CK vs. AI-Native Attack Vectors</text>

  <!-- Column 1: Lockheed Martin Kill Chain -->
  <g transform="translate(14, 60)">
    <rect width="164" height="340" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="6"/>
    <rect width="164" height="32" fill="#dbeafe" rx="6"/>
    <rect width="164" height="16" y="16" fill="#dbeafe"/>
    <text x="82" y="14" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">LOCKHEED MARTIN</text>
    <text x="82" y="28" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">KILL CHAIN</text>
    <text x="82" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Perimeter &amp; Host Intrusion</text>
    <text x="14" y="76" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">1. Reconnaissance</text>
    <text x="14" y="96" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">2. Weaponization</text>
    <text x="14" y="116" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">3. Delivery</text>
    <text x="14" y="136" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">4. Exploitation</text>
    <text x="14" y="156" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">5. Installation</text>
    <text x="14" y="176" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">6. C2 (Command)</text>
    <text x="14" y="196" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">7. Actions on Obj.</text>
    <rect x="14" y="220" width="136" height="22" fill="#dbeafe" rx="4"/>
    <text x="82" y="235" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Linear Progression</text>
  </g>

  <!-- Column 2: MITRE ATT&CK -->
  <g transform="translate(188, 60)">
    <rect width="164" height="340" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
    <rect width="164" height="32" fill="#ede9fe" rx="6"/>
    <rect width="164" height="16" y="16" fill="#ede9fe"/>
    <text x="82" y="14" fill="#6d28d9" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">MITRE ATT&amp;CK</text>
    <text x="82" y="28" fill="#6d28d9" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">FRAMEWORK</text>
    <text x="82" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Enterprise TTPs &amp; Behaviors</text>
    <text x="14" y="76" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Initial Access (T1190)</text>
    <text x="14" y="96" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Execution (T1059)</text>
    <text x="14" y="116" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Persistence (T1053)</text>
    <text x="14" y="136" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Priv. Escalation (T1068)</text>
    <text x="14" y="156" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Defense Evasion (T1027)</text>
    <text x="14" y="176" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Cred. Access (T1003)</text>
    <text x="14" y="196" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Exfiltration (T1041)</text>
    <rect x="14" y="220" width="136" height="22" fill="#ede9fe" rx="4"/>
    <text x="82" y="235" fill="#6d28d9" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Matrix-Based / Non-Linear</text>
  </g>

  <!-- Column 3: MITRE ATLAS -->
  <g transform="translate(362, 60)">
    <rect width="164" height="340" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" rx="6"/>
    <rect width="164" height="32" fill="#fef2f2" rx="6"/>
    <rect width="164" height="16" y="16" fill="#fef2f2"/>
    <text x="82" y="14" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">MITRE ATLAS</text>
    <text x="82" y="28" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">(AI SYSTEMS)</text>
    <text x="82" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" font-style="italic" text-anchor="middle">LLMs, Agents &amp; AI Pipelines</text>
    <text x="14" y="76" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">AI Recon (AML.TA0000)</text>
    <text x="14" y="96" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Model Access (TA0001)</text>
    <text x="14" y="116" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Prompt Inj. (TA0002)</text>
    <text x="14" y="136" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Data Poisoning (TA0003)</text>
    <text x="14" y="156" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Safety Evasion (TA0004)</text>
    <text x="14" y="176" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Model Inversion (TA0005)</text>
    <text x="14" y="196" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11">Agent Hijack (TA0006)</text>
    <rect x="14" y="220" width="136" height="22" fill="#fef2f2" rx="4"/>
    <text x="82" y="235" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI-Native Adversary Tactics</text>
