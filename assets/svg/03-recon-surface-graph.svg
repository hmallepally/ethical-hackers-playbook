    <rect x="7.2" y="146.4" width="84.6" height="13.2" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="49.5" y="155.4" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">81% TIME REDUCTION</text>
