    <rect x="6" y="108" width="78" height="30" fill="#fef2f2" stroke="#f87171" rx="2.4"/>
    <text x="39" y="120" fill="#b91c1c" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">BOLA / Data Leak</text>
    <text x="39" y="129.6" fill="#991b1b" font-family="monospace" font-size="8.5" text-anchor="middle">Token exfiltrated</text>
