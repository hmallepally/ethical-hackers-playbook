    <rect width="486" height="42" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" rx="4.8"/>
    <text x="14.4" y="16.8" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800">BLUE TEAM MITIGATION ARSENAL:</text>
    <text x="14.4" y="30" fill="#166534" font-family="sans-serif" font-size="16">1. Strict delimiter boundaries (&lt;retrieved_data&gt;) • 2. Semantic ingestion guardrails (Llama Guard 3) • 3. Tool authorization whitelists</text>
