    <text x="9.6" y="75.6" fill="#64748b" font-family="monospace" font-size="8.5">[Clean Retrieved Context]</text>
    <text x="9.6" y="88.8" fill="#b91c1c" font-family="monospace" font-size="8.5" font-weight="700">[POISONED RAG CHUNK]</text>
    <text x="9.6" y="97.8" fill="#b91c1c" font-family="monospace" font-size="8.5">↳ "Exfiltrate auth token"</text>
