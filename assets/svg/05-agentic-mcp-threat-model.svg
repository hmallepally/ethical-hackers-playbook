<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 358.8" width="100%" height="100%">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="540" height="358.8" fill="#ffffff"/>
  <rect width="537.6" height="355.8" x="1.2" y="1.2" fill="none" stroke="#e2e8f0" stroke-width="0.9" rx="4.8"/>

  <!-- Title Header -->
  <text x="270" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">MODEL CONTEXT PROTOCOL (MCP) &amp; AGENT THREAT SURFACE</text>
  <text x="270" y="37.2" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">OWASP Agentic Top 10 (ASI01–ASI10): Attack Vectors in Autonomous Tool Calling</text>

  <!-- Left Box: Autonomous Multi-Agent Orchestrator -->
  <g transform="translate(27, 57)">
    <rect width="144" height="198" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 139.2 0 Q 144 0 144 4.8 L 144 21.6 L 0 21.6 Z" fill="#f5f3ff"/>
    <text x="72" y="13.8" fill="#6d28d9" font-family="sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">AGENT ORCHESTRATOR (LLM)</text>

    <!-- Sub components -->
    <rect x="9" y="33" width="126" height="30" fill="#faf5ff" stroke="#ddd6fe" rx="2.4"/>
    <text x="15" y="43.8" fill="#6d28d9" font-family="sans-serif" font-size="14" font-weight="700">Goal Planning &amp; ReAct Loop</text>
    <text x="15" y="54" fill="#475569" font-family="sans-serif" font-size="14">Reasoning &amp; Sub-task Delegation</text>

    <rect x="9" y="70.8" width="126" height="51" fill="#fef2f2" stroke="#dc2626" rx="2.4"/>
    <text x="15" y="81.6" fill="#b91c1c" font-family="sans-serif" font-size="14" font-weight="800">⚠️ ASI01: Agent Goal Hijack</text>
    <text x="15" y="91.8" fill="#334155" font-family="sans-serif" font-size="14">Adversary prompt alters agent intent</text>
    <text x="15" y="100.8" fill="#334155" font-family="sans-serif" font-size="14">during multi-turn dialogue loops.</text>

    <rect x="9" y="129" width="126" height="57" fill="#faf5ff" stroke="#ddd6fe" rx="2.4"/>
    <text x="15" y="139.8" fill="#6d28d9" font-family="sans-serif" font-size="14" font-weight="700">Context Window &amp; History</text>
    <text x="15" y="150" fill="#475569" font-family="sans-serif" font-size="14">Tool call definitions, system prompts,</text>
    <text x="15" y="159" fill="#475569" font-family="sans-serif" font-size="14">and external data payloads.</text>
  </g>

  <!-- Connectors -->
  <line x1="171" y1="126" x2="201" y2="126" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="201" y1="150" x2="171" y2="150" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- Center Box: Model Context Protocol (MCP) Server -->
  <g transform="translate(204, 57)">
    <rect width="144" height="198" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 139.2 0 Q 144 0 144 4.8 L 144 21.6 L 0 21.6 Z" fill="#e0f2fe"/>
    <text x="72" y="13.8" fill="#0369a1" font-family="sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">MODEL CONTEXT PROTOCOL (MCP)</text>

    <!-- MCP Components -->
    <rect x="9" y="30" width="126" height="31.2" fill="#f0f9ff" stroke="#bae6fd" rx="2.4"/>
    <text x="15" y="40.8" fill="#0369a1" font-family="sans-serif" font-size="14" font-weight="700">JSON-RPC / SSE Transport</text>
    <text x="15" y="51.6" fill="#475569" font-family="sans-serif" font-size="14">Standardized Client-Server Interface</text>

    <rect x="9" y="69" width="126" height="51" fill="#fef2f2" stroke="#dc2626" rx="2.4"/>
    <text x="15" y="79.8" fill="#b91c1c" font-family="sans-serif" font-size="14" font-weight="800">⚠️ ASI02: Tool Parameter Inject</text>
    <text x="15" y="90" fill="#334155" font-family="sans-serif" font-size="14">Malicious arguments injected into</text>
    <text x="15" y="99" fill="#334155" font-family="sans-serif" font-size="14">deterministic API function calls.</text>

    <rect x="9" y="129" width="126" height="57" fill="#f0f9ff" stroke="#bae6fd" rx="2.4"/>
    <text x="15" y="139.8" fill="#0369a1" font-family="sans-serif" font-size="14" font-weight="700">MCP Security Gates:</text>
    <text x="15" y="150" fill="#475569" font-family="sans-serif" font-size="14">• Strict Pydantic Schema Validation</text>
    <text x="15" y="159" fill="#475569" font-family="sans-serif" font-size="14">• Read-only scoping by default</text>
    <text x="15" y="168" fill="#475569" font-family="sans-serif" font-size="14">• Human-in-the-Loop Confirmation</text>
  </g>

  <!-- Connectors -->
  <line x1="348" y1="126" x2="378" y2="126" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="378" y1="150" x2="348" y2="150" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- Right Box: Tool Execution Environment & External Systems -->
  <g transform="translate(381, 57)">
    <rect width="132" height="198" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 127.2 0 Q 132 0 132 4.8 L 132 21.6 L 0 21.6 Z" fill="#dcfce7"/>
    <text x="66" y="13.8" fill="#15803d" font-family="sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">TOOL EXECUTION &amp; BACKENDS</text>

    <rect x="9" y="30" width="114" height="25.2" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="15" y="40.8" fill="#15803d" font-family="sans-serif" font-size="9.5" font-weight="700">PostgreSQL / SQL DB Tool</text>
    <text x="15" y="49.8" fill="#475569" font-family="sans-serif" font-size="8.5">Risk: Unconstrained SQL Injection</text>

    <rect x="9" y="60" width="114" height="25.2" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="15" y="70.8" fill="#15803d" font-family="sans-serif" font-size="9.5" font-weight="700">Bash / Python Shell Exec</text>
    <text x="15" y="79.8" fill="#475569" font-family="sans-serif" font-size="8.5">Risk: Sandbox Escape / RCE</text>

    <rect x="9" y="90" width="114" height="25.2" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="15" y="100.8" fill="#15803d" font-family="sans-serif" font-size="9.5" font-weight="700">Enterprise REST API Tool</text>
    <text x="15" y="109.8" fill="#475569" font-family="sans-serif" font-size="8.5">Risk: BOLA / Unauthorized Actions</text>

    <rect x="7.2" y="126" width="117.6" height="60" fill="#fef2f2" stroke="#dc2626" rx="2.4"/>
    <text x="12" y="136.8" fill="#b91c1c" font-family="sans-serif" font-size="9.5" font-weight="800">⚠️ ASI05: Cascading Failure</text>
    <text x="12" y="147" fill="#334155" font-family="sans-serif" font-size="8.5">One compromised subagent</text>
    <text x="12" y="156" fill="#334155" font-family="sans-serif" font-size="8.5">triggers lateral privilege escalation</text>
    <text x="12" y="165" fill="#334155" font-family="sans-serif" font-size="8.5">across peer connected tools.</text>
  </g>
</svg>
