<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <marker id="arr-purple-loop" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="900" height="360" fill="#ffffff"/>
  <rect width="896" height="356" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="36" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">CONTINUOUS AI-ORCHESTRATED ADVERSARY EMULATION</text>
  <text x="450" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Automated Purple Team Feedback Loop: Daily Validation &amp; Detection Rule Synthesis</text>

  <!-- 5 Sequential Cards in Loop -->

  <!-- 1. Selects Techniques -->
  <g transform="translate(40, 85)">
    <rect width="150" height="180" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 142 0 Q 150 0 150 8 L 150 32 L 0 32 Z" fill="#f5f3ff"/>
    <text x="75" y="21" fill="#6d28d9" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">1. AI ORCHESTRATOR</text>
    <text x="12" y="56" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Dynamic Selection</text>
    <text x="12" y="78" fill="#475569" font-family="sans-serif" font-size="9">• Samples 10 random ATT&amp;CK / ATLAS techniques</text>
    <text x="12" y="125" fill="#475569" font-family="sans-serif" font-size="9">• Prioritizes recent CTI threat trends</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="190" y1="175" x2="210" y2="175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple-loop)"/>

  <!-- 2. Executes Atomics -->
  <g transform="translate(210, 85)">
    <rect width="150" height="180" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 142 0 Q 150 0 150 8 L 150 32 L 0 32 Z" fill="#fee2e2"/>
    <text x="75" y="21" fill="#b91c1c" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">2. ATOMIC EXECUTION</text>
    <text x="12" y="56" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Adversary Probing</text>
    <text x="12" y="78" fill="#475569" font-family="sans-serif" font-size="9">• Runs Atomic Red Team test harnesses</text>
    <text x="12" y="125" fill="#475569" font-family="sans-serif" font-size="9">• Generates realistic attack telemetry</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="360" y1="175" x2="380" y2="175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple-loop)"/>

  <!-- 3. Telemetry Monitor -->
  <g transform="translate(380, 85)">
    <rect width="150" height="180" fill="#ffffff" stroke="#0284c7" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 142 0 Q 150 0 150 8 L 150 32 L 0 32 Z" fill="#e0f2fe"/>
    <text x="75" y="21" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">3. SIEM MONITOR</text>
    <text x="12" y="56" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Detection Audit</text>
    <text x="12" y="78" fill="#475569" font-family="sans-serif" font-size="9">• Queries SIEM / EDR alert indices</text>
    <text x="12" y="125" fill="#475569" font-family="sans-serif" font-size="9">• Correlates expected vs. fired alerts</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="530" y1="175" x2="550" y2="175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple-loop)"/>

  <!-- 4. Gap Analysis -->
  <g transform="translate(550, 85)">
    <rect width="150" height="180" fill="#ffffff" stroke="#ea580c" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 142 0 Q 150 0 150 8 L 150 32 L 0 32 Z" fill="#ffedd5"/>
    <text x="75" y="21" fill="#c2410c" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">4. GAP ANALYSIS</text>
    <text x="12" y="56" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Blindspot Scoring</text>
    <text x="12" y="78" fill="#475569" font-family="sans-serif" font-size="9">• "4/10 techniques went undetected"</text>
    <text x="12" y="125" fill="#475569" font-family="sans-serif" font-size="9">• Quantifies visibility degradation</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <line x1="700" y1="175" x2="720" y2="175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple-loop)"/>

  <!-- 5. Rule Synthesis -->
  <g transform="translate(720, 85)">
    <rect width="140" height="180" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 132 0 Q 140 0 140 8 L 140 32 L 0 32 Z" fill="#dcfce7"/>
    <text x="70" y="21" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">5. RULE SYNTHESIS</text>
    <text x="12" y="56" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Auto Remediation</text>
    <text x="12" y="78" fill="#475569" font-family="sans-serif" font-size="9">• Generates Sigma &amp; YARA-L rules</text>
    <text x="12" y="125" fill="#475569" font-family="sans-serif" font-size="9">• Submits PR to detection repo</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 790 265 V 305 H 115 V 265" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-purple-loop)"/>
  <rect x="340" y="293" width="220" height="24" fill="#ffffff" stroke="#ddd6fe" rx="4"/>
  <text x="450" y="309" fill="#6d28d9" font-family="sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">DAILY CONTINUOUS REPEAT CYCLE</text>
</svg>
