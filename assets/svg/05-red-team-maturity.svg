<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="900" height="546" fill="#ffffff"/>
  <rect width="896" height="541" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">THE RED TEAM MATURITY MODEL: 4 PROGRESSION LEVELS</text>
  <text x="450" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">From Compliance Checkboxes to Autonomous 24/7 Machine Adversary Emulation</text>

  <!-- 4 Level Columns -->

  <!-- LEVEL 1 -->
  <g transform="translate(40, 85)">
    <rect width="190" height="295" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#f1f5f9"/>
    <text x="95" y="22" fill="#334155" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">LEVEL 1: COMPLIANCE</text>
    <text x="95" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Annual Checkbox</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0">• SOC 2 / PCI / HIPAA audit</text>
      <text x="0" y="22">• Fixed scope &amp; static dates</text>
      <text x="0" y="44">• Predictable known findings</text>
      <text x="0" y="66">• Point-in-time snapshot</text>
      <text x="0" y="100" fill="#dc2626" font-weight="700">Reality:</text>
      <text x="0" y="118" fill="#dc2626">"Passing an audit ≠</text>
      <text x="0" y="136" fill="#dc2626">being secure"</text>
    </g>

    <rect x="12" y="260" width="166" height="22" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
    <text x="95" y="275" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">~60% of Enterprises</text>
  </g>

  <!-- LEVEL 2 -->
  <g transform="translate(245, 85)">
    <rect width="190" height="295" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#e0f2fe"/>
    <text x="95" y="22" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">LEVEL 2: ADVERSARIAL</text>
    <text x="95" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Quarterly Exercises</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0">• Broader unannounced scope</text>
      <text x="0" y="22">• Adversary TTP simulation</text>
      <text x="0" y="44">• Testing business logic</text>
      <text x="0" y="66">• Chained exploit paths</text>
      <text x="0" y="100" fill="#0369a1" font-weight="700">Outcome:</text>
      <text x="0" y="118">Findings drive core</text>
      <text x="0" y="136">architecture changes</text>
    </g>

    <rect x="12" y="260" width="166" height="22" fill="#f0f9ff" stroke="#bae6fd" rx="4"/>
    <text x="95" y="275" fill="#0369a1" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">~25% of Enterprises</text>
  </g>

  <!-- LEVEL 3 -->
  <g transform="translate(450, 85)">
    <rect width="190" height="295" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#f5f3ff"/>
    <text x="95" y="22" fill="#6d28d9" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">LEVEL 3: AUGMENTED</text>
    <text x="95" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Continuous 24/7 AI</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0">• Automated 24/7 probes</text>
      <text x="0" y="22">• Real-time attack surface</text>
      <text x="0" y="44">• Promptfoo CI/CD gates</text>
      <text x="0" y="66">• Daily threat triage</text>
      <text x="0" y="100" fill="#6d28d9" font-weight="700">Outcome:</text>
      <text x="0" y="118">Human testers focus</text>
      <text x="0" y="136">on novel zero-days</text>
    </g>

    <rect x="12" y="260" width="166" height="22" fill="#faf5ff" stroke="#ddd6fe" rx="4"/>
    <text x="95" y="275" fill="#6d28d9" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">~12% Frontier Tech</text>
  </g>

  <!-- LEVEL 4 -->
  <g transform="translate(655, 85)">
    <rect width="205" height="295" fill="#ffffff" stroke="#059669" stroke-width="2.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 197 0 Q 205 0 205 8 L 205 34 L 0 34 Z" fill="#dcfce7"/>
    <text x="102.5" y="22" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">LEVEL 4: AUTONOMOUS</text>
    <text x="102.5" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">Continuous Purple Loop</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0">• Autonomous agents (XBOW)</text>
      <text x="0" y="22">• Live Red ↔ Blue tuning</text>
      <text x="0" y="44">• Dynamic risk score models</text>
      <text x="0" y="66">• Auto Sigma rule synthesis</text>
      <text x="0" y="100" fill="#15803d" font-weight="800">Outcome:</text>
      <text x="0" y="118" font-weight="700">Sub-minute automated</text>
      <text x="0" y="136" font-weight="700">defensive adaptation</text>
    </g>

    <rect x="12" y="260" width="181" height="22" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="102.5" y="275" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">Top 3% Global Defense</text>
  </g>
</svg>
