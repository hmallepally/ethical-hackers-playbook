  <text x="270" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">Multi-Layer Interception: Sub-Minute Detection, Triage, and Autonomous Containment</text>

