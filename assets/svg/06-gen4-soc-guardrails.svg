<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="url(#bg)" rx="12"/>
  <rect width="898" height="458" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GEN 4 AI-NATIVE SOC &amp; 3-TIER GUARDRAIL DEFENSE</text>
  <text x="450" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Multi-Layer Interception: Sub-Minute Detection, Triage, and Autonomous Containment</text>

  <!-- Left: Ingress Telemetry Stream -->
  <g transform="translate(45, 90)">
    <rect width="160" height="330" fill="#151e2e" stroke="#334155" stroke-width="1.5" rx="8"/>
    <text x="80" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">TELEMETRY INGRESS</text>

    <g transform="translate(15, 50)">
      <rect width="130" height="45" fill="#0f172a" stroke="#1e293b" rx="4"/>
      <text x="65" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">EDR Endpoints</text>
      <text x="65" y="35" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">CrowdStrike / S1</text>

      <rect y="60" width="130" height="45" fill="#0f172a" stroke="#1e293b" rx="4"/>
      <text x="65" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cloud &amp; Identity</text>
      <text x="65" y="95" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">Entra ID / Okta</text>

      <rect y="120" width="130" height="45" fill="#0f172a" stroke="#1e293b" rx="4"/>
      <text x="65" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Shadow AI Probes</text>
      <text x="65" y="155" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">Ollama / vLLM API</text>

      <rect y="180" width="130" height="45" fill="#0f172a" stroke="#1e293b" rx="4"/>
      <text x="65" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Network / SIEM</text>
      <text x="65" y="215" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">Splunk / Sentinel</text>
    </g>

    <text x="80" y="305" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">100K+ Events / sec</text>
  </g>

  <!-- Flow 1 to 2 -->
  <line x1="205" y1="250" x2="245" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Center Big Shield: 3-Tier AI Guardrail Engine -->
  <g transform="translate(250, 90)">
    <rect width="400" height="330" fill="#0c1f24" stroke="#059669" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 392 0 Q 400 0 400 8 L 400 36 L 0 36 Z" fill="url(#shield-grad)"/>
    <text x="200" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">3-TIER AI GUARDRAIL &amp; REASONING STACK</text>

    <!-- Tier 1 -->
    <g transform="translate(20, 50)">
      <rect width="360" height="65" fill="#0f2b2b" stroke="#10b981" rx="6"/>
      <text x="15" y="20" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">TIER 1: INPUT SANITIZATION &amp; SAFETY</text>
      <text x="15" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="10">Model: Meta Llama Guard 3 / Promptfoo Firewall</text>
      <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="9">Filters direct prompt injections, jailbreak tokens, and malicious payloads.</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(20, 125)">
      <rect width="360" height="65" fill="#132c38" stroke="#0284c7" rx="6"/>
      <text x="15" y="20" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">TIER 2: EXECUTION RAILS &amp; DIALOGUE LOGIC</text>
      <text x="15" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="10">Engine: NVIDIA NeMo Guardrails (Colang Rules)</text>
      <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="9">Constrains action flows, enforces tool calling schemas, blocks topic drift.</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(20, 200)">
      <rect width="360" height="65" fill="#241a38" stroke="#8b5cf6" rx="6"/>
      <text x="15" y="20" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">TIER 3: OUTPUT &amp; EGRESS HALLUCINATION FILTER</text>
      <text x="15" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="10">Scanners: PII Redaction + Groundedness Verification</text>
      <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="9">Prevents data leaks, credential disclosures, and hallucinated system actions.</text>
    </g>

    <text x="200" y="300" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Average Processing Latency: &lt; 85ms</text>
  </g>

  <!-- Flow 2 to 3 -->
  <line x1="650" y1="250" x2="690" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Right: Automated Containment & Response -->
  <g transform="translate(695, 90)">
    <rect width="160" height="330" fill="#151e2e" stroke="#334155" stroke-width="1.5" rx="8"/>
    <text x="80" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SOAR CONTAINMENT</text>

    <g transform="translate(15, 50)">
      <rect width="130" height="45" fill="#29121a" stroke="#ef4444" rx="4"/>
      <text x="65" y="18" fill="#fca5a5" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Endpoint Isolation</text>
      <text x="65" y="32" fill="#f87171" font-family="monospace" font-size="8" text-anchor="middle">Execution: &lt; 15s</text>

      <rect y="60" width="130" height="45" fill="#29121a" stroke="#ef4444" rx="4"/>
      <text x="65" y="78" fill="#fca5a5" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Token Revocation</text>
      <text x="65" y="92" fill="#f87171" font-family="monospace" font-size="8" text-anchor="middle">Instant Invalidation</text>

      <rect y="120" width="130" height="55" fill="#112920" stroke="#10b981" rx="4"/>
      <text x="65" y="138" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Human Gate (HITL)</text>
      <text x="65" y="152" fill="#a7f3d0" font-family="sans-serif" font-size="8" text-anchor="middle">Critical Assets Only</text>
      <text x="65" y="165" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">1-Click Slack / Teams</text>

      <rect y="185" width="130" height="45" fill="#0f172a" stroke="#1e293b" rx="4"/>
      <text x="65" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Graph Correlation</text>
      <text x="65" y="218" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Pre-compiled RCA</text>
    </g>

    <text x="80" y="305" fill="#10b981" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Total Dwell: &lt; 47s</text>
  </g>
</svg>
