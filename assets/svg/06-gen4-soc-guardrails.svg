      <text x="39" y="11.4" fill="#991b1b" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Endpoint Isolation</text>
      <text x="39" y="19.8" fill="#dc2626" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">Execution: &lt; 15s</text>

      <rect y="34.8" width="78" height="27" fill="#fef2f2" stroke="#fca5a5" rx="2.4"/>
      <text x="39" y="46.8" fill="#991b1b" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Token Revocation</text>
      <text x="39" y="55.8" fill="#dc2626" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">Instant Invalidation</text>

