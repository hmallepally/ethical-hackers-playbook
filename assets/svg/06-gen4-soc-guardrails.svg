      <text x="39" y="98.4" fill="#15803d" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">1-Click Approval</text>

      <rect y="110.4" width="78" height="27" fill="#f8fafc" stroke="#cbd5e1" rx="2.4"/>
      <text x="39" y="122.4" fill="#0f172a" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Graph Correlation</text>
      <text x="39" y="130.8" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">Pre-compiled RCA</text>
