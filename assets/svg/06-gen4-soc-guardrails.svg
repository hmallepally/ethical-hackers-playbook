<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="100%" height="100%">
  <defs>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect width="900" height="598" fill="#ffffff"/>
  <rect width="896" height="593" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">GEN 4 AI-NATIVE SOC &amp; 3-TIER GUARDRAIL DEFENSE</text>
  <text x="450" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">Multi-Layer Interception: Sub-Minute Detection, Triage, and Autonomous Containment</text>

  <!-- Left: Ingress Telemetry Stream -->
  <g transform="translate(45, 90)">
    <rect width="160" height="335" fill="#ffffff" stroke="#64748b" stroke-width="2" rx="8"/>
    <rect width="160" height="36" fill="#f1f5f9" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 152 0 Q 160 0 160 8 L 160 36 L 0 36 Z" fill="#f1f5f9"/>
    <text x="80" y="23" fill="#334155" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">TELEMETRY INGRESS</text>

    <g transform="translate(15, 48)">
      <rect width="130" height="45" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="65" y="20" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">EDR Endpoints</text>
      <text x="65" y="35" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">CrowdStrike / S1</text>

      <rect y="58" width="130" height="45" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="65" y="78" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Cloud &amp; Identity</text>
      <text x="65" y="93" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">Entra ID / Okta</text>

      <rect y="116" width="130" height="45" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="65" y="136" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Shadow AI Probes</text>
      <text x="65" y="151" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">Ollama / vLLM API</text>

      <rect y="174" width="130" height="45" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="65" y="194" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Network / SIEM</text>
      <text x="65" y="209" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">Splunk / Sentinel</text>
    </g>

    <text x="80" y="305" fill="#0284c7" font-family="monospace" font-size="9.5" font-weight="800" text-anchor="middle">100K+ Events / sec</text>
  </g>

  <!-- Flow 1 to 2 -->
  <line x1="205" y1="250" x2="245" y2="250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Center Big Shield: 3-Tier AI Guardrail Engine -->
  <g transform="translate(250, 90)">
    <rect width="400" height="335" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 392 0 Q 400 0 400 8 L 400 36 L 0 36 Z" fill="#dcfce7"/>
    <text x="200" y="23" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">3-TIER AI GUARDRAIL &amp; REASONING STACK</text>

    <!-- Tier 1 -->
    <g transform="translate(20, 48)">
      <rect width="360" height="68" fill="#f0fdf4" stroke="#86efac" rx="6"/>
      <text x="15" y="20" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800">TIER 1: INPUT SANITIZATION &amp; SAFETY</text>
      <text x="15" y="38" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="600">Model: Meta Llama Guard 3 / Promptfoo Firewall</text>
      <text x="15" y="54" fill="#475569" font-family="sans-serif" font-size="14">Filters direct prompt injections, jailbreak tokens, and malicious payloads.</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(20, 126)">
      <rect width="360" height="68" fill="#f0f9ff" stroke="#bae6fd" rx="6"/>
      <text x="15" y="20" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="800">TIER 2: EXECUTION RAILS &amp; DIALOGUE LOGIC</text>
      <text x="15" y="38" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="600">Engine: NVIDIA NeMo Guardrails (Colang Rules)</text>
      <text x="15" y="54" fill="#475569" font-family="sans-serif" font-size="14">Constrains action flows, enforces tool calling schemas, blocks topic drift.</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(20, 204)">
      <rect width="360" height="68" fill="#faf5ff" stroke="#ddd6fe" rx="6"/>
      <text x="15" y="20" fill="#6d28d9" font-family="sans-serif" font-size="16" font-weight="800">TIER 3: OUTPUT &amp; EGRESS HALLUCINATION FILTER</text>
      <text x="15" y="38" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="600">Scanners: PII Redaction + Groundedness Verification</text>
      <text x="15" y="54" fill="#475569" font-family="sans-serif" font-size="14">Prevents data leaks, credential disclosures, and hallucinated system actions.</text>
    </g>

    <text x="200" y="305" fill="#15803d" font-family="monospace" font-size="10.5" font-weight="800" text-anchor="middle">Average Processing Latency: &lt; 85ms</text>
  </g>

  <!-- Flow 2 to 3 -->
  <line x1="650" y1="250" x2="690" y2="250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Right: Automated Containment & Response -->
  <g transform="translate(695, 90)">
    <rect width="160" height="335" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 152 0 Q 160 0 160 8 L 160 36 L 0 36 Z" fill="#fee2e2"/>
    <text x="80" y="23" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">SOAR CONTAINMENT</text>

    <g transform="translate(15, 48)">
      <rect width="130" height="45" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
      <text x="65" y="19" fill="#991b1b" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Endpoint Isolation</text>
      <text x="65" y="33" fill="#dc2626" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">Execution: &lt; 15s</text>

      <rect y="58" width="130" height="45" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
      <text x="65" y="78" fill="#991b1b" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Token Revocation</text>
      <text x="65" y="93" fill="#dc2626" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">Instant Invalidation</text>

      <rect y="116" width="130" height="58" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="65" y="136" fill="#15803d" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Human Gate (HITL)</text>
      <text x="65" y="150" fill="#166534" font-family="sans-serif" font-size="8.5" text-anchor="middle">Critical Assets Only</text>
      <text x="65" y="164" fill="#15803d" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">1-Click Approval</text>

      <rect y="184" width="130" height="45" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="65" y="204" fill="#0f172a" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Graph Correlation</text>
      <text x="65" y="218" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">Pre-compiled RCA</text>
    </g>

    <text x="80" y="305" fill="#16a34a" font-family="monospace" font-size="9.5" font-weight="800" text-anchor="middle">Total Dwell: &lt; 47s</text>
  </g>
</svg>
