<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#ffffff"/>
  
  <text x="270" y="25" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">GEN 4 AI-NATIVE SOC &amp; 3-TIER GUARDRAILS</text>
  <text x="270" y="45" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Multi-Layer Interception: Sub-Minute Detection, Triage &amp; Autonomous Containment</text>

  <!-- Left: Telemetry Ingress -->
  <g transform="translate(10, 65)">
    <rect width="110" height="270" fill="#ffffff" stroke="#64748b" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 104 0 Q 110 0 110 6 L 110 30 L 0 30 Z" fill="#f1f5f9"/>
    <text x="55" y="20" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TELEMETRY</text>

    <g transform="translate(5, 40)">
      <rect width="100" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="50" y="16" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">EDR Endpoints</text>
      <text x="50" y="30" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">CrowdStrike / S1</text>
      
      <rect y="50" width="100" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="50" y="66" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cloud / Identity</text>
      <text x="50" y="80" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Entra ID / Okta</text>
      
      <rect y="100" width="100" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="50" y="116" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI Probes</text>
      <text x="50" y="130" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Ollama / vLLM</text>
      
      <rect y="150" width="100" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="50" y="166" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Network / SIEM</text>
      <text x="50" y="180" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Splunk / Sentinel</text>
    </g>

    <text x="55" y="250" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">100K+ Events/s</text>
  </g>

  <line x1="125" y1="200" x2="145" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Center: Guardrail Engine -->
  <g transform="translate(150, 65)">
    <rect width="240" height="270" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 234 0 Q 240 0 240 6 L 240 30 L 0 30 Z" fill="#dcfce7"/>
    <text x="120" y="20" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3-TIER AI GUARDRAIL STACK</text>

    <!-- Tier 1 -->
    <g transform="translate(10, 40)">
      <rect width="220" height="55" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="110" y="16" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T1: INPUT SANITIZATION</text>
      <text x="110" y="32" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Llama Guard 3 / Firewall</text>
      <text x="110" y="46" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Filters injections &amp; payloads</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(10, 105)">
      <rect width="220" height="55" fill="#f0f9ff" stroke="#bae6fd" rx="4"/>
      <text x="110" y="16" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T2: EXECUTION RAILS</text>
      <text x="110" y="32" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">NeMo Guardrails</text>
      <text x="110" y="46" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Constrains action flows &amp; schemas</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(10, 170)">
      <rect width="220" height="55" fill="#faf5ff" stroke="#ddd6fe" rx="4"/>
      <text x="110" y="16" fill="#6d28d9" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T3: OUTPUT FILTER</text>
      <text x="110" y="32" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">PII Redaction + Verification</text>
      <text x="110" y="46" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Prevents leaks &amp; hallucinations</text>
    </g>

    <text x="120" y="250" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Avg Latency: &lt; 85ms</text>
  </g>

  <line x1="395" y1="200" x2="415" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Right: Automated Containment -->
  <g transform="translate(420, 65)">
    <rect width="110" height="270" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 104 0 Q 110 0 110 6 L 110 30 L 0 30 Z" fill="#fee2e2"/>
    <text x="55" y="20" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CONTAINMENT</text>

    <g transform="translate(5, 40)">
      <rect width="100" height="40" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
      <text x="50" y="16" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Isolation</text>
      <text x="50" y="30" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Exec: &lt; 15s</text>
      
      <rect y="50" width="100" height="40" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
      <text x="50" y="66" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Token Revoke</text>
      <text x="50" y="80" fill="#dc2626" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Instant Invalid</text>
      
      <rect y="100" width="100" height="50" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="50" y="116" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Human Gate</text>
      <text x="50" y="130" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Critical Assets</text>
      <text x="50" y="142" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1-Click Approve</text>
      
      <rect y="160" width="100" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="50" y="176" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Graph Correl.</text>
      <text x="50" y="190" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Pre-compiled RCA</text>
    </g>

    <text x="55" y="250" fill="#16a34a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dwell: &lt; 47s</text>
  </g>
</svg>
