<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <rect width="540" height="380" fill="#ffffff"/>
  
  <text x="270" y="30" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">THE SOC EVOLUTION: 2015 → 2026</text>
  <text x="270" y="50" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13" text-anchor="middle">From Manual Log Warehouses to AI-Native Defense</text>

  <!-- Gen 1 -->
  <g transform="translate(10, 70)">
    <rect width="122" height="260" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 116 0 Q 122 0 122 6 L 122 35 L 0 35 Z" fill="#e2e8f0"/>
    <text x="61" y="22" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GEN 1 (2015)</text>
    
    <text x="61" y="55" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Log Warehouse</text>
    
    <text x="10" y="75" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Core:</text>
    <text x="10" y="90" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Splunk, QRadar</text>
    
    <text x="10" y="115" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Staff:</text>
    <text x="10" y="130" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">30+ analysts</text>
    
    <text x="10" y="155" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Avg Dwell:</text>
    <text x="10" y="170" fill="#b91c1c" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">200+ Days</text>
    
    <rect x="10" y="200" width="102" height="45" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="61" y="218" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Reactive Forensic</text>
    <text x="61" y="233" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Archiving</text>
  </g>

  <!-- Gen 2 -->
  <g transform="translate(142, 70)">
    <rect width="122" height="260" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
