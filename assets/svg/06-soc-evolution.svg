    <text x="61" y="233" fill="#0f766e" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Telemetry</text>
  </g>

  <!-- Gen 4 -->
  <g transform="translate(406, 70)">
    <rect width="122" height="260" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 116 0 Q 122 0 122 6 L 122 35 L 0 35 Z" fill="#dcfce7"/>
