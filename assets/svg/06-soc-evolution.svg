    <text x="61" y="218" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Machine-Speed</text>
    <text x="61" y="233" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Defense Parity</text>
