<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 327.6" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="540" height="327.6" fill="#ffffff"/>
  <rect width="537.6" height="324.6" x="1.2" y="1.2" fill="none" stroke="#e2e8f0" stroke-width="0.9" rx="4.8"/>

  <!-- Title Header -->
  <text x="270" y="22.8" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">THE SOC EVOLUTION: 2015 → 2026</text>
  <text x="270" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">From Manual Log Warehouses to Autonomous AI-Native Defense Platforms</text>

  <!-- 4 Generation Cards -->

  <!-- GEN 1 (2015) -->
  <g transform="translate(24, 51)">
    <rect width="114" height="177" fill="#ffffff" stroke="#94a3b8" stroke-width="0.9" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 109.2 0 Q 114 0 114 4.8 L 114 20.4 L 0 20.4 Z" fill="#f1f5f9"/>
    <text x="57" y="13.2" fill="#334155" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">GEN 1 (2015)</text>
    <text x="57" y="32.4" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">The Log Warehouse</text>

    <g transform="translate(8.4, 45)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0" font-weight="700" fill="#0f172a">Core Tooling:</text>
      <text x="0" y="10.8">• Splunk, ArcSight, QRadar</text>
      <text x="0" y="21.6">• Raw log ingestion</text>

      <text x="0" y="42" font-weight="700" fill="#0f172a">Staffing Model:</text>
      <text x="0" y="52.8">• 50+ human analysts</text>
      <text x="0" y="63.6">• 24/7 manual eye-on-glass</text>

      <text x="0" y="84" font-weight="700" fill="#0f172a">Dwell Time &amp; Response:</text>
      <text x="0" y="94.8" fill="#dc2626" font-weight="700">• Dwell: 200+ Days</text>
      <text x="0" y="105.6">• Manual call to consultants</text>
    </g>

    <rect x="7.2" y="156" width="99.6" height="13.2" fill="#f8fafc" stroke="#cbd5e1" rx="2.4"/>
    <text x="57" y="165" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Reactive Forensic Archiving</text>
  </g>

  <!-- GEN 2 (2018) -->
  <g transform="translate(147, 51)">
    <rect width="114" height="177" fill="#ffffff" stroke="#0284c7" stroke-width="0.9" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 109.2 0 Q 114 0 114 4.8 L 114 20.4 L 0 20.4 Z" fill="#e0f2fe"/>
    <text x="57" y="13.2" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">GEN 2 (2018)</text>
    <text x="57" y="32.4" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">The Alert Factory</text>

    <g transform="translate(8.4, 45)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0" font-weight="700" fill="#0f172a">Core Tooling:</text>
      <text x="0" y="10.8">• CrowdStrike, SentinelOne</text>
      <text x="0" y="21.6">• Endpoint Detection (EDR)</text>

      <text x="0" y="42" font-weight="700" fill="#0f172a">Staffing Model:</text>
      <text x="0" y="52.8">• 30 analysts</text>
      <text x="0" y="63.6">• Alert fatigue epidemic</text>

      <text x="0" y="84" font-weight="700" fill="#0f172a">Dwell Time &amp; Response:</text>
      <text x="0" y="94.8" fill="#ea580c" font-weight="700">• Dwell: 56 Days (Mandiant)</text>
      <text x="0" y="105.6">• Runbook manual isolation</text>
    </g>

