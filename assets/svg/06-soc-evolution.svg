    <text x="61" y="55" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alert Factory</text>
    
    <text x="10" y="75" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Core:</text>
    <text x="10" y="90" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">CarbonBlack, S1</text>
    
    <text x="10" y="115" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Staff:</text>
    <text x="10" y="130" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">15 analysts</text>
    
    <text x="10" y="155" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Avg Dwell:</text>
