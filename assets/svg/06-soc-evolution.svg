    <text x="10" y="115" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Staff:</text>
    <text x="10" y="130" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">5-10 Hunters</text>
    
    <text x="10" y="155" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Avg Dwell:</text>
    <text x="10" y="170" fill="#16a34a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">&lt; 47 Seconds</text>
    
