    <text x="61" y="218" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Endpoint Behav.</text>
    <text x="61" y="233" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Rules</text>
  </g>

