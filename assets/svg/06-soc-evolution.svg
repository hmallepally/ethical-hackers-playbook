    <text x="10" y="130" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">10 analysts</text>
    
    <text x="10" y="155" fill="#0f766e" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Avg Dwell:</text>
