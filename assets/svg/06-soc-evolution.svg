    <text x="57" y="165" fill="#0369a1" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Endpoint Behavioral Rules</text>
  </g>

  <!-- GEN 3 (2022) -->
  <g transform="translate(270, 51)">
    <rect width="114" height="177" fill="#ffffff" stroke="#7c3aed" stroke-width="0.9" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 109.2 0 Q 114 0 114 4.8 L 114 20.4 L 0 20.4 Z" fill="#f5f3ff"/>
    <text x="57" y="13.2" fill="#6d28d9" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">GEN 3 (2022)</text>
    <text x="57" y="32.4" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Intelligence Platform</text>

    <g transform="translate(8.4, 45)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0" font-weight="700" fill="#0f172a">Core Tooling:</text>
      <text x="0" y="10.8">• XDR + SOAR Automation</text>
      <text x="0" y="21.6">• Pre-built playbook scripts</text>

      <text x="0" y="42" font-weight="700" fill="#0f172a">Staffing Model:</text>
      <text x="0" y="52.8">• 15 analysts</text>
      <text x="0" y="63.6">• Script maintenance focus</text>

      <text x="0" y="84" font-weight="700" fill="#0f172a">Dwell Time &amp; Response:</text>
      <text x="0" y="94.8" fill="#ca8a04" font-weight="700">• Dwell: 16 Days</text>
      <text x="0" y="105.6">• Semi-automated playbooks</text>
    </g>

    <rect x="7.2" y="156" width="99.6" height="13.2" fill="#faf5ff" stroke="#ddd6fe" rx="2.4"/>
    <text x="57" y="165" fill="#6d28d9" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Cross-Domain Telemetry</text>
  </g>

  <!-- GEN 4 (2026) -->
  <g transform="translate(393, 51)">
    <rect width="123" height="177" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 118.2 0 Q 123 0 123 4.8 L 123 20.4 L 0 20.4 Z" fill="#dcfce7"/>
    <text x="61.5" y="13.2" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">GEN 4 (2026)</text>
    <text x="61.5" y="32.4" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">The AI-Native SOC</text>

    <g transform="translate(8.4, 45)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0" font-weight="700" fill="#0f172a">Core Tooling:</text>
      <text x="0" y="10.8">• AI Copilots + Autonomous Agents</text>
      <text x="0" y="21.6">• 3-Tier Guardrails (Llama/NeMo)</text>

      <text x="0" y="42" font-weight="700" fill="#0f172a">Staffing Model:</text>
      <text x="0" y="52.8">• 5-10 Strategic Threat Hunters</text>
      <text x="0" y="63.6">• Supervising AI triage loops</text>

      <text x="0" y="84" font-weight="700" fill="#0f172a">Dwell Time &amp; Response:</text>
      <text x="0" y="94.8" fill="#15803d" font-weight="800">• Dwell: &lt; 47 Seconds</text>
      <text x="0" y="105.6">• Autonomous containment</text>
    </g>

    <rect x="7.2" y="156" width="108.6" height="13.2" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="61.5" y="165" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">Machine-Speed Defense Parity</text>
  </g>
</svg>
