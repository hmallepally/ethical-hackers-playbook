<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="900" height="460" fill="#ffffff"/>
  <rect width="896" height="456" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" text-anchor="middle">EU AI ACT RISK CLASSIFICATION &amp; GOVERNANCE PYRAMID</text>
  <text x="450" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Regulation (EU) 2024/1689 &amp; NIST AI 600-1 Compliance for Security Systems</text>

  <!-- Risk Pyramid Tiers (Stacked) -->

  <!-- Tier 1: Unacceptable Risk (Top) -->
  <g transform="translate(60, 85)">
    <rect width="780" height="70" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 190 0 L 190 70 L 8 70 Q 0 70 0 62 Z" fill="#fee2e2"/>
    <text x="95" y="32" fill="#991b1b" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">UNACCEPTABLE RISK</text>
    <text x="95" y="50" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">STRICTLY PROHIBITED</text>

    <!-- Details -->
    <text x="210" y="30" fill="#b91c1c" font-family="sans-serif" font-size="11" font-weight="800">Scope: Social scoring, biometric categorization, unconstrained autonomous weapon systems.</text>
    <text x="210" y="50" fill="#334155" font-family="sans-serif" font-size="10.5">Penalty: Fines up to €35,000,000 or 7% of global annual turnover.</text>
  </g>

  <!-- Tier 2: High Risk (Security Tooling) -->
  <g transform="translate(60, 165)">
    <rect width="780" height="85" fill="#ffffff" stroke="#ea580c" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 190 0 L 190 85 L 8 85 Q 0 85 0 77 Z" fill="#ffedd5"/>
    <text x="95" y="36" fill="#9a3412" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">HIGH-RISK AI</text>
    <text x="95" y="54" fill="#c2410c" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ANNEX III / ARTICLE 6</text>
    <text x="95" y="70" fill="#ea580c" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">2026 Enforcement</text>

    <!-- Details -->
    <text x="210" y="28" fill="#c2410c" font-family="sans-serif" font-size="11" font-weight="800">Scope: Critical Infrastructure, Automated Security SOAR, Cyber Vulnerability Profiling.</text>
    <text x="210" y="48" fill="#334155" font-family="sans-serif" font-size="10">Mandatory: 1. Risk Management (Art 9) • 2. Data Governance (Art 10) • 3. Human Gate (Art 14)</text>
    <text x="210" y="66" fill="#334155" font-family="sans-serif" font-size="10">4. Technical Robustness &amp; Cybersecurity Adversarial Hardening (Art 15)</text>
  </g>

  <!-- Tier 3: Limited Risk (GenAI & Chatbots) -->
  <g transform="translate(60, 260)">
    <rect width="780" height="75" fill="#ffffff" stroke="#ca8a04" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 190 0 L 190 75 L 8 75 Q 0 75 0 67 Z" fill="#fef9c3"/>
    <text x="95" y="34" fill="#854d0e" font-family="sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">SPECIFIC TRANSPARENCY</text>
    <text x="95" y="52" fill="#a16207" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ARTICLE 50</text>

    <!-- Details -->
    <text x="210" y="32" fill="#a16207" font-family="sans-serif" font-size="11" font-weight="800">Scope: Customer-facing AI Chatbots, Generative Text/Code Assistants, Synthetic Media.</text>
    <text x="210" y="52" fill="#334155" font-family="sans-serif" font-size="10.5">Mandatory: Explicit disclosure that the user is interacting with an AI system; watermarking.</text>
  </g>

  <!-- Tier 4: Minimal Risk (Internal Automation) -->
  <g transform="translate(60, 345)">
    <rect width="780" height="65" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 190 0 L 190 65 L 8 65 Q 0 65 0 57 Z" fill="#dcfce7"/>
    <text x="95" y="30" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">MINIMAL / NO RISK</text>
    <text x="95" y="48" fill="#166534" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PERMITTED FREELY</text>

    <!-- Details -->
    <text x="210" y="28" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="800">Scope: Spam filters, AI-assisted video games, heuristic anomaly baselines.</text>
    <text x="210" y="48" fill="#334155" font-family="sans-serif" font-size="10.5">Requirements: Voluntary adherence to ISO/IEC 42001 &amp; NIST AI 600-1 profiles.</text>
  </g>
</svg>
