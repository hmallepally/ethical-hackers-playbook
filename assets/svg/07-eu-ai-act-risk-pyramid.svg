<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" fill="url(#bg)" rx="12"/>
  <rect width="898" height="458" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">EU AI ACT RISK CLASSIFICATION &amp; GOVERNANCE PYRAMID</text>
  <text x="450" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Regulation (EU) 2024/1689 &amp; NIST AI 600-1 Compliance for Security Systems</text>

  <!-- Risk Pyramid Tiers (Left to Right / Stacked) -->

  <!-- Tier 1: Unacceptable Risk (Top) -->
  <g transform="translate(60, 85)">
    <rect width="780" height="70" fill="#2d1217" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <rect width="180" height="70" fill="#7f1d1d" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 180 0 L 180 70 L 8 70 Q 0 70 0 62 Z" fill="#7f1d1d"/>
    <text x="90" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">UNACCEPTABLE RISK</text>
    <text x="90" y="50" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">STRICTLY PROHIBITED</text>

    <!-- Details -->
    <text x="200" y="30" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700">Scope: Social scoring, biometric categorization, unconstrained autonomous weapon systems.</text>
    <text x="200" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10">Penalty: Fines up to €35,000,000 or 7% of global annual turnover.</text>
  </g>

  <!-- Tier 2: High Risk (Security Tooling) -->
  <g transform="translate(60, 165)">
    <rect width="780" height="85" fill="#2d1d12" stroke="#f97316" stroke-width="1.5" rx="8"/>
    <rect width="180" height="85" fill="#9a3412" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 180 0 L 180 85 L 8 85 Q 0 85 0 77 Z" fill="#9a3412"/>
    <text x="90" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">HIGH-RISK AI</text>
    <text x="90" y="54" fill="#fdba74" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">ANNEX III / ARTICLE 6</text>
    <text x="90" y="70" fill="#fed7aa" font-family="monospace" font-size="9" text-anchor="middle">2026 Enforcement</text>

    <!-- Details -->
    <text x="200" y="28" fill="#fdba74" font-family="sans-serif" font-size="11" font-weight="700">Scope: Critical Infrastructure, Automated Security SOAR, Cyber Vulnerability Profiling.</text>
    <text x="200" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="10">Mandatory: 1. Risk Management (Art 9) • 2. Data Governance (Art 10) • 3. Human Gate (Art 14)</text>
    <text x="200" y="66" fill="#cbd5e1" font-family="sans-serif" font-size="10">4. Technical Robustness &amp; Cybersecurity Adversarial Hardening (Art 15)</text>
  </g>

  <!-- Tier 3: Limited Risk (GenAI & Chatbots) -->
  <g transform="translate(60, 260)">
    <rect width="780" height="75" fill="#1e2416" stroke="#eab308" stroke-width="1.5" rx="8"/>
    <rect width="180" height="75" fill="#854d0e" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 180 0 L 180 75 L 8 75 Q 0 75 0 67 Z" fill="#854d0e"/>
    <text x="90" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SPECIFIC TRANSPARENCY</text>
    <text x="90" y="52" fill="#fef08a" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">ARTICLE 50</text>

    <!-- Details -->
    <text x="200" y="32" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="700">Scope: Customer-facing AI Chatbots, Generative Text/Code Assistants, Synthetic Media.</text>
    <text x="200" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="10">Mandatory: Explicit disclosure that the user is interacting with an AI system; watermarking.</text>
  </g>

  <!-- Tier 4: Minimal Risk (Internal Automation) -->
  <g transform="translate(60, 345)">
    <rect width="780" height="65" fill="#12241f" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <rect width="180" height="65" fill="#065f46" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 180 0 L 180 65 L 8 65 Q 0 65 0 57 Z" fill="#065f46"/>
    <text x="90" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">MINIMAL / NO RISK</text>
    <text x="90" y="48" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">PERMITTED FREELY</text>

    <!-- Details -->
    <text x="200" y="28" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700">Scope: Spam filters, AI-assisted video games, heuristic anomaly baselines.</text>
    <text x="200" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10">Requirements: Voluntary adherence to ISO/IEC 42001 &amp; NIST AI 600-1 profiles.</text>
  </g>
</svg>
