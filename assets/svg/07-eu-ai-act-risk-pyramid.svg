<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="270" y="30" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">EU AI ACT RISK CLASSIFICATION</text>
  <text x="270" y="50" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#555">Regulation (EU) 2024/1689 &amp; NIST AI 600-1</text>
  
  <!-- Tier 1 -->
  <rect x="150" y="70" width="240" height="65" rx="5" fill="#ffeeee" stroke="#d32f2f" stroke-width="2"/>
  <text x="270" y="90" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b71c1c">UNACCEPTABLE RISK — PROHIBITED</text>
  <text x="270" y="105" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Social scoring, biometrics</text>
  <text x="270" y="120" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Fines: €35M or 7% turnover</text>

  <!-- Tier 2 -->
  <rect x="110" y="145" width="320" height="65" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="270" y="165" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">HIGH-RISK AI — ANNEX III / ART 6</text>
  <text x="270" y="180" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Critical infra, security SOAR</text>
  <text x="270" y="195" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Needs: Risk mgmt, data gov, human oversight</text>

  <!-- Tier 3 -->
  <rect x="70" y="220" width="400" height="65" rx="5" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="270" y="240" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57f17">SPECIFIC TRANSPARENCY — ARTICLE 50</text>
  <text x="270" y="255" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Customer chatbots, generative text/code</text>
  <text x="270" y="270" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Needs: Clear disclosure that AI is interacting</text>

  <!-- Tier 4 -->
  <rect x="30" y="295" width="480" height="65" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="270" y="315" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">MINIMAL / NO RISK — PERMITTED FREELY</text>
  <text x="270" y="330" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Spam filters, AI games, anomaly detection</text>
  <text x="270" y="345" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#000">• Voluntary: ISO/IEC 42001 &amp; NIST AI 600-1</text>
</svg>
