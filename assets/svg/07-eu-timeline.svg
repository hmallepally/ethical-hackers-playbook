  <line x1="67" y1="90" x2="472" y2="90" stroke="#ccc" stroke-width="4"/>
  <circle cx="67.5" cy="90" r="6" fill="#d32f2f"/>
  <circle cx="202.5" cy="90" r="6" fill="#f57c00"/>
  <circle cx="337.5" cy="90" r="6" fill="#1976d2"/>
  <circle cx="472.5" cy="90" r="6" fill="#388e3c"/>

  <!-- Card 1 -->
  <rect x="5" y="110" width="125" height="230" rx="5" fill="#ffeeee" stroke="#d32f2f" stroke-width="2"/>
  <text x="67.5" y="130" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b71c1c">FEB 2, 2025</text>
  <text x="67.5" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b71c1c">Prohibited</text>
  
  <text x="10" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Subliminal bans</text>
  <text x="10" y="185" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Social scoring</text>
  <text x="10" y="200" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Face scraping</text>
  <text x="10" y="215" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Predict police</text>
  
  <rect x="10" y="295" width="115" height="30" fill="#d32f2f" rx="3"/>
  <text x="67.5" y="309" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">ACTIVE</text>
  <text x="67.5" y="321" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">ENFORCEMENT</text>
  
  <!-- Card 2 -->
  <rect x="140" y="110" width="125" height="230" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="202.5" y="130" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">AUG 2, 2025</text>
  <text x="202.5" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e65100">GPAI Rules</text>
  
  <text x="145" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• OS exceptions</text>
  <text x="145" y="185" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Copyright OK</text>
  <text x="145" y="200" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Risk checks</text>
  <text x="145" y="215" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Penalties live</text>
  
  <rect x="145" y="295" width="115" height="30" fill="#f57c00" rx="3"/>
  <text x="202.5" y="309" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">GPAI</text>
  <text x="202.5" y="321" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">REGULATION</text>
  
  <!-- Card 3 -->
  <rect x="275" y="110" width="125" height="230" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="337.5" y="130" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d47a1">AUG 2, 2026</text>
  <text x="337.5" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0d47a1">High-Risk AI</text>
  
  <text x="280" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Strict enforce</text>
  <text x="280" y="185" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Cyber SOAR</text>
  <text x="280" y="200" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Risk audits</text>
  <text x="280" y="215" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Transp. DBs</text>
  
  <rect x="280" y="295" width="115" height="30" fill="#1976d2" rx="3"/>
  <text x="337.5" y="309" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">HIGH-RISK</text>
  <text x="337.5" y="321" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">ENFORCEMENT</text>

  <!-- Card 4 -->
  <rect x="410" y="110" width="125" height="230" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="472.5" y="130" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">AUG 2, 2027</text>
  <text x="472.5" y="145" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1b5e20">Full Apply</text>
  
  <text x="415" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• All provisions</text>
  <text x="415" y="185" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Market AI</text>
  <text x="415" y="200" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• All binding</text>
  <text x="415" y="215" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Cross-border</text>
  
  <rect x="415" y="295" width="115" height="30" fill="#388e3c" rx="3"/>
  <text x="472.5" y="309" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">100% REGULATORY</text>
  <text x="472.5" y="321" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">COVERAGE</text>
