    <rect x="12" y="225" width="181" height="22" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="102.5" y="240" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">100% REGULATORY COVERAGE</text>
