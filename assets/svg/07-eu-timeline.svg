      <text x="0" y="20">• Medical &amp; aviation AI</text>
      <text x="0" y="40">• All provisions binding</text>
      <text x="0" y="60">• €35M / 7% fines active</text>
      <text x="0" y="80">• Cross-border enforcement</text>
      <text x="0" y="100">• Global supply chain scope</text>
