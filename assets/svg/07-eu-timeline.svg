<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="900" height="494" fill="#ffffff"/>
  <rect width="896" height="489" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="36" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">EU AI ACT — MULTI-YEAR ENFORCEMENT TIMELINE</text>
  <text x="450" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">Staggered Milestones from Prohibited AI Bans (2025) to Full Application (2027)</text>

  <!-- 4 Timeline Phase Cards -->

  <!-- Phase 1: Feb 2, 2025 -->
  <g transform="translate(40, 85)">
    <rect width="190" height="260" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#fee2e2"/>
    <text x="95" y="22" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">FEB 2, 2025</text>
    <text x="95" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Prohibited Practices</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0">• Subliminal manipulation</text>
      <text x="0" y="20">• Social scoring systems</text>
      <text x="0" y="40">• Untargeted face scraping</text>
      <text x="0" y="60">• Workplace emotion AI</text>
      <text x="0" y="80">• Predictive policing profiling</text>
      <text x="0" y="100">• Mandatory AI literacy</text>
    </g>

    <rect x="12" y="225" width="166" height="22" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
    <text x="95" y="240" fill="#b91c1c" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">ACTIVE ENFORCEMENT</text>
  </g>

  <!-- Phase 2: Aug 2, 2025 -->
  <g transform="translate(245, 85)">
    <rect width="190" height="260" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#ffedd5"/>
    <text x="95" y="22" fill="#9a3412" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">AUG 2, 2025</text>
    <text x="95" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">GPAI Model Rules</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
      <text x="0" y="0">• GPAI tech documentation</text>
      <text x="0" y="20">• Copyright compliance</text>
      <text x="0" y="40">• Systemic risk evaluations</text>
      <text x="0" y="60">• Adversarial model testing</text>
      <text x="0" y="80">• National authorities active</text>
      <text x="0" y="100">• Penalty framework live</text>
