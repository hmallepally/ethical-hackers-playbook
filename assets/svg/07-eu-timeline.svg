<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="270" y="30" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">EU AI ACT — ENFORCEMENT TIMELINE</text>
