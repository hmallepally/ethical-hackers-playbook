    <rect width="190" height="260" fill="#ffffff" stroke="#0284c7" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#e0f2fe"/>
    <text x="95" y="22" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">AUG 2, 2026</text>
    <text x="95" y="54" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">High-Risk AI Systems</text>

    <g transform="translate(14, 75)" font-family="sans-serif" font-size="9.5" fill="#475569">
