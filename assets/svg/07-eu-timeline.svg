      <text x="0" y="20">• Cybersecurity SOAR rules</text>
      <text x="0" y="40">• Mandatory risk audits</text>
      <text x="0" y="60">• Human oversight gates</text>
      <text x="0" y="80">• Transparency disclosures</text>
      <text x="0" y="100">• Regulatory sandboxes</text>
    </g>

    <rect x="12" y="225" width="166" height="22" fill="#f0f9ff" stroke="#7dd3fc" rx="4"/>
    <text x="95" y="240" fill="#0284c7" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">HIGH-RISK ENFORCEMENT</text>
