    <rect x="12" y="225" width="166" height="22" fill="#fff7ed" stroke="#fdba74" rx="4"/>
    <text x="95" y="240" fill="#c2410c" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">GPAI REGULATION</text>
  </g>

