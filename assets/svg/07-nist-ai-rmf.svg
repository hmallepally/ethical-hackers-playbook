  <rect x="280" y="80" width="115" height="230" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="337.5" y="105" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">MEASURE</text>
  
  <text x="285" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Bias scoring</text>
  <text x="285" y="145" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Red teaming</text>
  <text x="285" y="160" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Data audits</text>
  
  <rect x="285" y="280" width="105" height="20" fill="#388e3c" rx="3"/>
  <text x="337.5" y="294" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">QUANT. AUDIT</text>

  <!-- Arrow -->
  <line x1="395" y1="195" x2="410" y2="195" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MANAGE -->
  <rect x="415" y="80" width="115" height="230" rx="5" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="472.5" y="105" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#004d40">MANAGE</text>
  
  <text x="420" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Guardrails</text>
