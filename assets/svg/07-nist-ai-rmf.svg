  <!-- GOVERN -->
  <rect x="10" y="80" width="115" height="230" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="67.5" y="105" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">GOVERN</text>
  
  <text x="15" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• AI charter</text>
