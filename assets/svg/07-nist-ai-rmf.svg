  <text x="150" y="130" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Risk scope</text>
  <text x="150" y="145" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• Supply chain</text>
  <text x="150" y="160" font-family="'Segoe UI', sans-serif" font-size="11" fill="#000">• 3rd-party eval</text>
  
  <rect x="150" y="280" width="105" height="20" fill="#f57c00" rx="3"/>
  <text x="202.5" y="294" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">CONTEXT IDENT.</text>

  <!-- Arrow -->
  <line x1="260" y1="195" x2="275" y2="195" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/>

