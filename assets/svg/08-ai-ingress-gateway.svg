<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="700" height="380" fill="#ffffff"/>
  <rect width="696" height="376" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="640" height="46" fill="#0f172a" rx="8"/>
  <text x="350" y="50" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">ENTERPRISE AI INGRESS GATEWAY</text>

  <!-- Subtitle -->
  <text x="350" y="84" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" font-style="italic">Centralized policy enforcement for all enterprise AI traffic</text>

  <!-- Layer 1 -->
  <g transform="translate(50, 100)">
    <rect width="600" height="44" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="6"/>
    <circle cx="26" cy="22" r="14" fill="#3b82f6"/>
    <text x="26" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="52" y="27" fill="#1e40af" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">IDENTITY &amp; SSO AUTHENTICATION</text>
    <text x="380" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">Okta / Azure AD / Google Workspace</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(50, 152)">
    <rect width="600" height="44" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <circle cx="26" cy="22" r="14" fill="#f59e0b"/>
    <text x="26" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="52" y="27" fill="#92400e" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">DLP &amp; PII TOKENIZATION</text>
    <text x="310" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">Auto-redacts SSNs, API keys, source code</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(50, 204)">
    <rect width="600" height="44" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6"/>
    <circle cx="26" cy="22" r="14" fill="#22c55e"/>
    <text x="26" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="52" y="27" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">ZERO-DATA-RETENTION (ZDR) CONTRACTS</text>
    <text x="430" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">No model training on prompts</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(50, 256)">
    <rect width="600" height="44" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" rx="6"/>
    <circle cx="26" cy="22" r="14" fill="#a855f7"/>
    <text x="26" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="52" y="27" fill="#7e22ce" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">LATENCY &amp; COST TELEMETRY</text>
    <text x="330" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">Real-time usage dashboard &amp; budgets</text>
  </g>

  <!-- Layer 5 -->
  <g transform="translate(50, 308)">
    <rect width="600" height="44" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
    <circle cx="26" cy="22" r="14" fill="#ef4444"/>
    <text x="26" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="52" y="27" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">PROMPT INJECTION INSPECTION</text>
    <text x="346" y="27" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">Evasion &amp; adversarial input shield</text>
  </g>
</svg>
