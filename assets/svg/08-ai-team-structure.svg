<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="900" height="420" fill="#ffffff"/>
  <rect width="896" height="416" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" text-anchor="middle">THE AI-READY CYBERSECURITY TEAM STRUCTURE</text>
  <text x="450" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Organizational Architecture for CISOs: Cross-Functional Integration &amp; Specialized Roles</text>

  <!-- CISO & Security Leadership -->
  <g transform="translate(300, 85)">
    <rect width="300" height="50" fill="#0f172a" rx="6"/>
    <text x="150" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">CHIEF INFORMATION SECURITY OFFICER</text>
    <text x="150" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Board Reporting • Material Risk • AI Strategy &amp; Budget</text>
  </g>

  <!-- Connectors -->
  <line x1="450" y1="135" x2="450" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="165" x2="760" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="165" x2="140" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="345" y1="165" x2="345" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="555" y1="165" x2="555" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <line x1="760" y1="165" x2="760" y2="185" stroke="#94a3b8" stroke-width="2"/>

  <!-- Pillar 1: Offensive AI & Red Team -->
  <g transform="translate(45, 185)">
    <rect width="190" height="205" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 184 0 Q 190 0 190 6 L 190 32 L 0 32 Z" fill="#fee2e2"/>
    <text x="95" y="21" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">OFFENSIVE AI &amp; RED</text>

    <g transform="translate(12, 48)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="14" font-weight="700" fill="#0f172a">• AI Red Teamer</text>
      <text x="8" y="28" fill="#64748b">Jailbreak / Inversion test</text>
      
      <text x="0" y="52" font-weight="700" fill="#0f172a">• Prompt Evaluator</text>
      <text x="8" y="66" fill="#64748b">PyRIT / Promptfoo CI/CD</text>

      <text x="0" y="90" font-weight="700" fill="#0f172a">• Agent Penetration Lead</text>
      <text x="8" y="104" fill="#64748b">MCP tool hijack testing</text>
    </g>

    <rect x="10" y="170" width="170" height="24" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
    <text x="95" y="186" fill="#b91c1c" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Continuous Machine Probing</text>
  </g>

  <!-- Pillar 2: AI-Native Blue Team / SOC -->
  <g transform="translate(250, 185)">
    <rect width="190" height="205" fill="#ffffff" stroke="#0284c7" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 184 0 Q 190 0 190 6 L 190 32 L 0 32 Z" fill="#e0f2fe"/>
    <text x="95" y="21" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">AI-NATIVE DEFENSE</text>

    <g transform="translate(12, 48)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="14" font-weight="700" fill="#0f172a">• Gen 4 SOC Analyst</text>
      <text x="8" y="28" fill="#64748b">Autonomous alert triage</text>

      <text x="0" y="52" font-weight="700" fill="#0f172a">• AI Threat Hunter</text>
      <text x="8" y="66" fill="#64748b">Behavioral graph queries</text>

      <text x="0" y="90" font-weight="700" fill="#0f172a">• SOAR Automation Eng</text>
      <text x="8" y="104" fill="#64748b">47-second containment play</text>
    </g>

    <rect x="10" y="170" width="170" height="24" fill="#f0f9ff" stroke="#bae6fd" rx="4"/>
    <text x="95" y="186" fill="#0369a1" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Sub-Minute Containment</text>
  </g>

  <!-- Pillar 3: AI Safety & Architecture -->
  <g transform="translate(455, 185)">
    <rect width="190" height="205" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 184 0 Q 190 0 190 6 L 190 32 L 0 32 Z" fill="#f5f3ff"/>
    <text x="95" y="21" fill="#6d28d9" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">SAFETY &amp; ARCHITECTURE</text>

    <g transform="translate(12, 48)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="14" font-weight="700" fill="#0f172a">• GenAI Safety Architect</text>
      <text x="8" y="28" fill="#64748b">Guardrails &amp; NeMo policies</text>

      <text x="0" y="52" font-weight="700" fill="#0f172a">• LLM Gateway Engineer</text>
      <text x="8" y="66" fill="#64748b">DLP &amp; token routing</text>

      <text x="0" y="90" font-weight="700" fill="#0f172a">• TPRM AI Auditor</text>
      <text x="8" y="104" fill="#64748b">Third-party SaaS model vet</text>
    </g>

    <rect x="10" y="170" width="170" height="24" fill="#faf5ff" stroke="#ddd6fe" rx="4"/>
    <text x="95" y="186" fill="#6d28d9" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Zero-Data-Retention Trust</text>
  </g>

  <!-- Pillar 4: GRC & Board Governance -->
  <g transform="translate(660, 185)">
    <rect width="195" height="205" fill="#ffffff" stroke="#059669" stroke-width="2" rx="6"/>
    <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 32 L 0 32 Z" fill="#dcfce7"/>
    <text x="97.5" y="21" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">GOVERNANCE &amp; GRC</text>

    <g transform="translate(12, 48)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="14" font-weight="700" fill="#0f172a">• AI Compliance Officer</text>
      <text x="8" y="28" fill="#64748b">EU AI Act &amp; ISO 42001</text>

      <text x="0" y="52" font-weight="700" fill="#0f172a">• SEC Reporting Lead</text>
      <text x="8" y="66" fill="#64748b">4-Day 8-K disclosure flow</text>

      <text x="0" y="90" font-weight="700" fill="#0f172a">• Cyber Risk Actuary</text>
      <text x="8" y="104" fill="#64748b">ROSI &amp; Loss modeling</text>
    </g>

    <rect x="10" y="170" width="175" height="24" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="97.5" y="186" fill="#15803d" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Board &amp; Legal Defensibility</text>
  </g>
</svg>
