<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 327.6" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="540" height="327.6" fill="#ffffff"/>
  <rect width="537.6" height="324.6" x="1.2" y="1.2" fill="none" stroke="#e2e8f0" stroke-width="0.9" rx="4.8"/>

  <!-- Title Header -->
  <text x="270" y="22.8" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">THE AI-READY CYBERSECURITY TEAM STRUCTURE</text>
  <text x="270" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">Organizational Architecture for CISOs: Cross-Functional Integration &amp; Specialized Roles</text>

  <!-- CISO & Security Leadership -->
  <g transform="translate(180, 51)">
    <rect width="180" height="30" fill="#0f172a" rx="3.6"/>
    <text x="90" y="15" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">CHIEF INFORMATION SECURITY OFFICER</text>
    <text x="90" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Board Reporting • Material Risk • AI Strategy &amp; Budget</text>
  </g>

  <!-- Connectors -->
  <line x1="270" y1="81" x2="270" y2="99" stroke="#94a3b8" stroke-width="2"/>
  <line x1="84" y1="99" x2="456" y2="99" stroke="#94a3b8" stroke-width="2"/>
  <line x1="84" y1="99" x2="84" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="207" y1="99" x2="207" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="333" y1="99" x2="333" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="456" y1="99" x2="456" y2="111" stroke="#94a3b8" stroke-width="2"/>

  <!-- Pillar 1: Offensive AI & Red Team -->
  <g transform="translate(27, 111)">
    <rect width="114" height="123" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" rx="3.6"/>
    <path d="M 0 3.6 Q 0 0 3.6 0 L 110.4 0 Q 114 0 114 3.6 L 114 19.2 L 0 19.2 Z" fill="#fee2e2"/>
    <text x="57" y="12.6" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">OFFENSIVE AI &amp; RED</text>

    <g transform="translate(7.2, 28.8)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="8.4" font-weight="700" fill="#0f172a">• AI Red Teamer</text>
      <text x="4.8" y="16.8" fill="#64748b">Jailbreak / Inversion test</text>
      
      <text x="0" y="31.2" font-weight="700" fill="#0f172a">• Prompt Evaluator</text>
      <text x="4.8" y="39.6" fill="#64748b">PyRIT / Promptfoo CI/CD</text>

      <text x="0" y="54" font-weight="700" fill="#0f172a">• Agent Penetration Lead</text>
      <text x="4.8" y="62.4" fill="#64748b">MCP tool hijack testing</text>
    </g>

    <rect x="6" y="102" width="102" height="14.4" fill="#fef2f2" stroke="#fca5a5" rx="2.4"/>
    <text x="57" y="111.6" fill="#b91c1c" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Continuous Machine Probing</text>
  </g>

  <!-- Pillar 2: AI-Native Blue Team / SOC -->
  <g transform="translate(150, 111)">
    <rect width="114" height="123" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" rx="3.6"/>
    <path d="M 0 3.6 Q 0 0 3.6 0 L 110.4 0 Q 114 0 114 3.6 L 114 19.2 L 0 19.2 Z" fill="#e0f2fe"/>
    <text x="57" y="12.6" fill="#0369a1" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">AI-NATIVE DEFENSE</text>

    <g transform="translate(7.2, 28.8)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="8.4" font-weight="700" fill="#0f172a">• Gen 4 SOC Analyst</text>
      <text x="4.8" y="16.8" fill="#64748b">Autonomous alert triage</text>

      <text x="0" y="31.2" font-weight="700" fill="#0f172a">• AI Threat Hunter</text>
      <text x="4.8" y="39.6" fill="#64748b">Behavioral graph queries</text>

      <text x="0" y="54" font-weight="700" fill="#0f172a">• SOAR Automation Eng</text>
      <text x="4.8" y="62.4" fill="#64748b">47-second containment play</text>
    </g>

    <rect x="6" y="102" width="102" height="14.4" fill="#f0f9ff" stroke="#bae6fd" rx="2.4"/>
    <text x="57" y="111.6" fill="#0369a1" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Sub-Minute Containment</text>
  </g>

  <!-- Pillar 3: AI Safety & Architecture -->
  <g transform="translate(273, 111)">
    <rect width="114" height="123" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" rx="3.6"/>
    <path d="M 0 3.6 Q 0 0 3.6 0 L 110.4 0 Q 114 0 114 3.6 L 114 19.2 L 0 19.2 Z" fill="#f5f3ff"/>
    <text x="57" y="12.6" fill="#6d28d9" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">SAFETY &amp; ARCHITECTURE</text>

    <g transform="translate(7.2, 28.8)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="8.4" font-weight="700" fill="#0f172a">• GenAI Safety Architect</text>
      <text x="4.8" y="16.8" fill="#64748b">Guardrails &amp; NeMo policies</text>

      <text x="0" y="31.2" font-weight="700" fill="#0f172a">• LLM Gateway Engineer</text>
      <text x="4.8" y="39.6" fill="#64748b">DLP &amp; token routing</text>

      <text x="0" y="54" font-weight="700" fill="#0f172a">• TPRM AI Auditor</text>
      <text x="4.8" y="62.4" fill="#64748b">Third-party SaaS model vet</text>
    </g>

    <rect x="6" y="102" width="102" height="14.4" fill="#faf5ff" stroke="#ddd6fe" rx="2.4"/>
    <text x="57" y="111.6" fill="#6d28d9" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Zero-Data-Retention Trust</text>
  </g>

  <!-- Pillar 4: GRC & Board Governance -->
  <g transform="translate(396, 111)">
    <rect width="117" height="123" fill="#ffffff" stroke="#059669" stroke-width="1.2" rx="3.6"/>
    <path d="M 0 3.6 Q 0 0 3.6 0 L 113.4 0 Q 117 0 117 3.6 L 117 19.2 L 0 19.2 Z" fill="#dcfce7"/>
    <text x="58.5" y="12.6" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">GOVERNANCE &amp; GRC</text>

    <g transform="translate(7.2, 28.8)" font-family="sans-serif" font-size="9.5" fill="#334155">
      <text x="0" y="8.4" font-weight="700" fill="#0f172a">• AI Compliance Officer</text>
      <text x="4.8" y="16.8" fill="#64748b">EU AI Act &amp; ISO 42001</text>

      <text x="0" y="31.2" font-weight="700" fill="#0f172a">• SEC Reporting Lead</text>
      <text x="4.8" y="39.6" fill="#64748b">4-Day 8-K disclosure flow</text>

      <text x="0" y="54" font-weight="700" fill="#0f172a">• Cyber Risk Actuary</text>
      <text x="4.8" y="62.4" fill="#64748b">ROSI &amp; Loss modeling</text>
    </g>

    <rect x="6" y="102" width="105" height="14.4" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="58.5" y="111.6" fill="#15803d" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Board &amp; Legal Defensibility</text>
  </g>
</svg>
