<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="540" height="380" fill="#ffffff"/>
  <rect width="536" height="376" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="270" y="32" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" text-anchor="middle">AI DEFENSE &amp; GOVERNANCE STACK</text>
  <text x="270" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Strategic Blueprint for CISOs: Risk to Autonomous Defense</text>

  <!-- Layer 1 -->
  <g transform="translate(20, 70)">
    <rect width="500" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" rx="6"/>
    <rect x="0" y="0" width="10" height="50" fill="#0f172a" rx="2"/>
    <text x="25" y="20" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">1. BOARDROOM &amp; EXECUTIVE OVERSIGHT</text>
    <text x="25" y="38" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">ROSI • SEC Materiality • Insurance • EU AI Act Risk</text>
    
    <rect x="400" y="12" width="90" height="26" fill="#0f172a" rx="4"/>
    <text x="445" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">FINANCIAL ROI</text>
  </g>

  <!-- Down Connector 1 -->
  <line x1="270" y1="120" x2="270" y2="135" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 2 -->
  <g transform="translate(20, 135)">
    <rect width="500" height="50" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="6"/>
    <rect x="0" y="0" width="10" height="50" fill="#0284c7" rx="2"/>
    <text x="25" y="20" fill="#0369a1" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">2. AI GATEWAY &amp; SHADOW AI GOVERNANCE</text>
    <text x="25" y="38" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-size="11">Zero-Data-Retention • DLP • API Vaults • Auto-Discovery</text>

    <rect x="400" y="12" width="90" height="26" fill="#0284c7" rx="4"/>
    <text x="445" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">DATA PRIVACY</text>
  </g>

  <!-- Down Connector 2 -->
  <line x1="270" y1="185" x2="270" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 3 -->
  <g transform="translate(20, 200)">
    <rect width="500" height="50" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" rx="6"/>
    <rect x="0" y="0" width="10" height="50" fill="#7c3aed" rx="2"/>
    <text x="25" y="20" fill="#6d28d9" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">3. RUNTIME SAFETY GUARDRAILS</text>
    <text x="25" y="38" fill="#7c3aed" font-family="'Segoe UI', sans-serif" font-size="11">3-Tier Guardrails • MCP Least-Privilege • Prompt Injection</text>

    <rect x="400" y="12" width="90" height="26" fill="#7c3aed" rx="4"/>
    <text x="445" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">RUNTIME DEF</text>
