  <line x1="270" y1="250" x2="270" y2="265" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 4 -->
  <g transform="translate(20, 265)">
    <rect width="500" height="50" fill="#f0fdf4" stroke="#059669" stroke-width="2" rx="6"/>
    <rect x="0" y="0" width="10" height="50" fill="#059669" rx="2"/>
    <text x="25" y="20" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">4. CONTINUOUS PURPLE TEAMING &amp; SOC</text>
