<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 312" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="540" height="312" fill="#ffffff"/>
  <rect width="537.6" height="309" x="1.2" y="1.2" fill="none" stroke="#e2e8f0" stroke-width="0.9" rx="4.8"/>

  <!-- Title Header -->
  <text x="270" y="22.8" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">THE ASYMMETRY SHIFT: BEFORE VS. WITH DEFENSIVE AI</text>
  <text x="270" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">Leveling the Battlefield: How Machine Intelligence Restores Defensive Parity</text>

  <!-- Left Card: BEFORE AI -->
  <g transform="translate(27, 51)">
    <rect width="228" height="168" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 223.2 0 Q 228 0 228 4.8 L 228 21.6 L 0 21.6 Z" fill="#fee2e2"/>
    <text x="114" y="13.8" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">BEFORE AI: ATTACKER DOMINANCE</text>

    <!-- Comparison Table Inside -->
    <g transform="translate(10.8, 33)" font-family="sans-serif" font-size="14">
      <text x="0" y="9" fill="#dc2626" font-weight="800">ATTACKER (Offense)</text>
      <text x="108" y="9" fill="#64748b" font-weight="800">DEFENDER (Manual)</text>
      <line x1="0" y1="14.4" x2="206.4" y2="14.4" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="0" y="26.4" fill="#334155">• Finds 1 vulnerability</text>
      <text x="108" y="26.4" fill="#64748b">• Must patch ALL vulnerabilities</text>

      <text x="0" y="42" fill="#334155">• Automates exploits</text>
      <text x="108" y="42" fill="#64748b">• Manually investigates alerts</text>

      <text x="0" y="57.6" fill="#334155">• Operates 24/7 script bot</text>
      <text x="108" y="57.6" fill="#64748b">• Human shift coverage gaps</text>

      <text x="0" y="73.2" fill="#334155">• Scales near-zero cost</text>
      <text x="108" y="73.2" fill="#64748b">• Constrained by talent pool</text>

      <text x="0" y="88.8" fill="#334155">• Machine-speed execution</text>
      <text x="108" y="88.8" fill="#64748b">• Human-bound delay (hours)</text>
    </g>

    <rect x="9.6" y="138" width="208.8" height="15.6" fill="#fef2f2" stroke="#fca5a5" rx="2.4"/>
    <text x="114" y="148.2" fill="#b91c1c" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">OUTCOME: SEVERE ADVERSARIAL ADVANTAGE</text>
  </g>

  <!-- Right Card: WITH DEFENSIVE AI -->
  <g transform="translate(285, 51)">
    <rect width="228" height="168" fill="#ffffff" stroke="#059669" stroke-width="1.2" rx="4.8"/>
    <path d="M 0 4.8 Q 0 0 4.8 0 L 223.2 0 Q 228 0 228 4.8 L 228 21.6 L 0 21.6 Z" fill="#dcfce7"/>
    <text x="114" y="13.8" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">WITH DEFENSIVE AI: MACHINE PARITY</text>

    <!-- Comparison Table Inside -->
    <g transform="translate(10.8, 33)" font-family="sans-serif" font-size="14">
      <text x="0" y="9" fill="#dc2626" font-weight="800">ATTACKER (AI-Enabled)</text>
      <text x="108" y="9" fill="#059669" font-weight="800">DEFENDER (AI-Native)</text>
      <line x1="0" y1="14.4" x2="206.4" y2="14.4" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="0" y="26.4" fill="#334155">• AI generates novel probes</text>
      <text x="108" y="26.4" fill="#047857" font-weight="600">• AI predicts &amp; discovers first</text>

      <text x="0" y="42" fill="#334155">• Polymorphic evasion</text>
      <text x="108" y="42" fill="#047857" font-weight="600">• Real-time behavioral UEBA</text>

      <text x="0" y="57.6" fill="#334155">• Hyper-scale phishing</text>
      <text x="108" y="57.6" fill="#047857" font-weight="600">• Semantic LLM mail defense</text>

      <text x="0" y="73.2" fill="#334155">• Autonomous agent tooling</text>
      <text x="108" y="73.2" fill="#047857" font-weight="600">• Continuous purple team loops</text>

      <text x="0" y="88.8" fill="#334155">• 27-second breakout speed</text>
      <text x="108" y="88.8" fill="#047857" font-weight="600">• &lt; 47-second SOAR containment</text>
    </g>

    <rect x="9.6" y="138" width="208.8" height="15.6" fill="#f0fdf4" stroke="#86efac" rx="2.4"/>
    <text x="114" y="148.2" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">OUTCOME: DEFENSIVE SPEED PARITY RESTORED</text>
  </g>
</svg>
