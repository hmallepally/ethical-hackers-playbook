<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="540" height="380" fill="#ffffff"/>
  <rect width="536" height="376" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="270" y="32" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" text-anchor="middle">THE ASYMMETRY SHIFT: BEFORE VS. WITH DEFENSIVE AI</text>
  <text x="270" y="52" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">How Machine Intelligence Restores Defensive Parity</text>

  <!-- Left Card -->
  <g transform="translate(15, 75)">
    <rect width="250" height="280" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="6"/>
    <rect width="250" height="36" fill="#ef4444" rx="6" stroke="none" />
    <rect width="250" height="10" y="26" fill="#ef4444" stroke="none" />
    <text x="125" y="23" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle">BEFORE AI: ATTACKER DOMINANCE</text>
    
    <!-- Table Headers -->
    <text x="15" y="60" fill="#b91c1c" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">ATTACKER</text>
    <text x="235" y="60" fill="#b91c1c" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="end">DEFENDER</text>
    <line x1="15" y1="68" x2="235" y2="68" stroke="#fca5a5" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="15" y="85" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Finds 1 Vuln</text>
    <text x="235" y="85" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Must Patch All</text>
    <line x1="15" y1="93" x2="235" y2="93" stroke="#fecaca" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="15" y="110" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Automates Exploits</text>
    <text x="235" y="110" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Manual Investigate</text>
    <line x1="15" y1="118" x2="235" y2="118" stroke="#fecaca" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="15" y="135" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">24/7 Bots</text>
    <text x="235" y="135" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Human Shift Gaps</text>
    <line x1="15" y1="143" x2="235" y2="143" stroke="#fecaca" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="15" y="160" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Zero-Cost Scaling</text>
    <text x="235" y="160" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Talent Constrained</text>
    <line x1="15" y1="168" x2="235" y2="168" stroke="#fecaca" stroke-width="1"/>

    <!-- Row 5 -->
    <text x="15" y="185" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Machine-Speed</text>
    <text x="235" y="185" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Hours Delay</text>
    
    <rect x="0" y="244" width="250" height="36" fill="#fee2e2" rx="0" ry="0"/>
    <text x="125" y="266" fill="#b91c1c" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">SEVERE ADVERSARIAL ADVANTAGE</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(275, 75)">
    <rect width="250" height="280" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="6"/>
    <rect width="250" height="36" fill="#16a34a" rx="6" stroke="none" />
    <rect width="250" height="10" y="26" fill="#16a34a" stroke="none" />
    <text x="125" y="23" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle">WITH AI: MACHINE PARITY</text>
    
    <!-- Table Headers -->
    <text x="15" y="60" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">ATTACKER (AI)</text>
    <text x="235" y="60" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="end">DEFENDER (AI)</text>
    <line x1="15" y1="68" x2="235" y2="68" stroke="#86efac" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="15" y="85" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Generates Probes</text>
    <text x="235" y="85" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Predicts &amp; Blocks</text>
    <line x1="15" y1="93" x2="235" y2="93" stroke="#bbf7d0" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="15" y="110" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Polymorphic</text>
    <text x="235" y="110" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Behavioral UEBA</text>
    <line x1="15" y1="118" x2="235" y2="118" stroke="#bbf7d0" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="15" y="135" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Hyper Phishing</text>
    <text x="235" y="135" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Semantic Filter</text>
    <line x1="15" y1="143" x2="235" y2="143" stroke="#bbf7d0" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="15" y="160" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">Autonomy</text>
    <text x="235" y="160" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">Auto Purple Team</text>
    <line x1="15" y1="168" x2="235" y2="168" stroke="#bbf7d0" stroke-width="1"/>

    <!-- Row 5 -->
    <text x="15" y="185" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="11">27s Breakout</text>
    <text x="235" y="185" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">47s SOAR Contain</text>
    
    <rect x="0" y="244" width="250" height="36" fill="#dcfce7" rx="0" ry="0"/>
    <text x="125" y="266" fill="#15803d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">SPEED PARITY RESTORED</text>
