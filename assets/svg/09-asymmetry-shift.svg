<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="900" height="400" fill="#ffffff"/>
  <rect width="896" height="396" x="2" y="2" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Header -->
  <text x="450" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" text-anchor="middle">THE ASYMMETRY SHIFT: BEFORE VS. WITH DEFENSIVE AI</text>
  <text x="450" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Leveling the Battlefield: How Machine Intelligence Restores Defensive Parity</text>

  <!-- Left Card: BEFORE AI -->
  <g transform="translate(45, 85)">
    <rect width="380" height="280" fill="#ffffff" stroke="#dc2626" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 372 0 Q 380 0 380 8 L 380 36 L 0 36 Z" fill="#fee2e2"/>
    <text x="190" y="23" fill="#991b1b" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">BEFORE AI: ATTACKER DOMINANCE</text>

    <!-- Comparison Table Inside -->
    <g transform="translate(18, 55)" font-family="sans-serif" font-size="10">
      <text x="0" y="15" fill="#dc2626" font-weight="800">ATTACKER (Offense)</text>
      <text x="180" y="15" fill="#64748b" font-weight="800">DEFENDER (Manual)</text>
      <line x1="0" y1="24" x2="344" y2="24" stroke="#e2e8f0" stroke-width="1"/>

      <text x="0" y="44" fill="#334155">• Finds 1 vulnerability</text>
      <text x="180" y="44" fill="#64748b">• Must patch ALL vulnerabilities</text>

      <text x="0" y="70" fill="#334155">• Automates exploits</text>
      <text x="180" y="70" fill="#64748b">• Manually investigates alerts</text>

      <text x="0" y="96" fill="#334155">• Operates 24/7 script bot</text>
      <text x="180" y="96" fill="#64748b">• Human shift coverage gaps</text>

      <text x="0" y="122" fill="#334155">• Scales near-zero cost</text>
      <text x="180" y="122" fill="#64748b">• Constrained by talent pool</text>

      <text x="0" y="148" fill="#334155">• Machine-speed execution</text>
      <text x="180" y="148" fill="#64748b">• Human-bound delay (hours)</text>
    </g>

    <rect x="16" y="230" width="348" height="26" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
    <text x="190" y="247" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">OUTCOME: SEVERE ADVERSARIAL ADVANTAGE</text>
  </g>

  <!-- Right Card: WITH DEFENSIVE AI -->
  <g transform="translate(475, 85)">
    <rect width="380" height="280" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8"/>
    <path d="M 0 8 Q 0 0 8 0 L 372 0 Q 380 0 380 8 L 380 36 L 0 36 Z" fill="#dcfce7"/>
    <text x="190" y="23" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">WITH DEFENSIVE AI: MACHINE PARITY</text>

    <!-- Comparison Table Inside -->
    <g transform="translate(18, 55)" font-family="sans-serif" font-size="10">
      <text x="0" y="15" fill="#dc2626" font-weight="800">ATTACKER (AI-Enabled)</text>
      <text x="180" y="15" fill="#059669" font-weight="800">DEFENDER (AI-Native)</text>
      <line x1="0" y1="24" x2="344" y2="24" stroke="#e2e8f0" stroke-width="1"/>

      <text x="0" y="44" fill="#334155">• AI generates novel probes</text>
      <text x="180" y="44" fill="#047857" font-weight="600">• AI predicts &amp; discovers first</text>

      <text x="0" y="70" fill="#334155">• Polymorphic evasion</text>
      <text x="180" y="70" fill="#047857" font-weight="600">• Real-time behavioral UEBA</text>

      <text x="0" y="96" fill="#334155">• Hyper-scale phishing</text>
      <text x="180" y="96" fill="#047857" font-weight="600">• Semantic LLM mail defense</text>

      <text x="0" y="122" fill="#334155">• Autonomous agent tooling</text>
      <text x="180" y="122" fill="#047857" font-weight="600">• Continuous purple team loops</text>

      <text x="0" y="148" fill="#334155">• 27-second breakout speed</text>
      <text x="180" y="148" fill="#047857" font-weight="600">• &lt; 47-second SOAR containment</text>
    </g>

    <rect x="16" y="230" width="348" height="26" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="190" y="247" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">OUTCOME: DEFENSIVE SPEED PARITY RESTORED</text>
  </g>
</svg>
